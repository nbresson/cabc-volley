<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gymnase — C.A. Brive Corrèze Volley</title>
<meta name="description" content="80 ans de volley au cœur de la Gaillarde. Équipes, calendrier, adhésion — rejoins la maison.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="C.A. Brive Corrèze Volley">
<meta property="og:title" content="Nos gymnases — C.A. Brive Corrèze Volley">
<meta property="og:description" content="80 ans de volley au cœur de la Gaillarde. Équipes, calendrier, adhésion — rejoins la maison.">
<meta property="og:image" content="https://cabc-volley.nkobrs21.workers.dev/assets/partage.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="assets/style.css">
</head><body>
<div id="header"></div>
<main id="main">
<div id="gymnase"></div>
</main>
<div id="footer"></div><script src="assets/site.js"></script>
<script>
window.__pageInit=async function(){
  const slug=new URLSearchParams(location.search).get("g");
  const [data,teams]=await Promise.all([getJSON("content/gymnases.json"),getJSON("content/teams.json")]);
  const el=document.getElementById("gymnase");
  const v=(data?.items||[]).find(x=>x.slug&&x.slug===slug);
  if(!v){el.innerHTML='<section class="pad section"><p class="muted">Site introuvable. <a href="acces.html" class="lien">Retour à nos gymnases</a></p></section>';return;}
  titrePage(v.nom);

  // Le bouton d itineraire ne parait que si l adresse saisie passe lienSur() :
  // salleCard() applique deja la meme regle a ce meme champ, cette page ne la
  // contredit plus.
  const iti=lienSur(v.itineraire);
  const entete=`<section class="pad section">
    <div class="crumb"><a href="index.html">Accueil</a><span>/</span><a href="acces.html">Nos gymnases</a><span>/</span><span style="color:var(--encre)">${echapper(v.nom)}</span></div>
    <div class="section-head" style="margin-bottom:0"><h1 style="font-size:clamp(32px,7vw,72px)">${echapper(v.nom)}</h1>${v.etiquette?`<span class="badge" style="align-self:flex-end">${echapper(v.etiquette)}</span>`:""}</div>
    ${v.adresse?`<p class="mono" style="margin-top:12px;font-size:12px;letter-spacing:.14em;color:var(--taupe)">${echapper(v.adresse)}</p>`:""}
    ${v.photo
      ?`<img src="${echapper(v.photo)}" alt="${echapper(v.nom)}" style="display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border:2px solid var(--encre);margin-top:24px">`
      :'<div class="ph" style="aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;border:2px solid var(--encre);margin-top:24px"><span class="mono" style="color:var(--mention)">[ photo à venir ]</span></div>'}
    <div class="row" style="margin-top:22px;align-items:center;gap:24px">
      ${[v.usage,v.acces].filter(Boolean).length?`<span class="mono" style="font-size:11px;letter-spacing:.14em">${echapper([v.usage,v.acces].filter(Boolean).join(" · "))}</span>`:""}
      ${iti?`<a href="${echapper(iti)}" target="_blank" rel="noopener" class="btn btn-secondary" style="padding:9px 20px">Itinéraire ↗</a>`:""}
    </div>
  </section>`;

  // La carte. OpenStreetMap et non Google : l embed de Google depose des
  // cookies et transmet l IP du visiteur avant toute interaction, ce qui
  // obligerait le site entier a porter une banniere de consentement. Il n en
  // a aucune, et c est un choix assume.
  //
  // Number() et non la valeur brute : ce qui entre dans l adresse du cadre
  // doit etre un nombre, jamais une chaine saisie. Sans coordonnees, la
  // section n existe pas — le reste de la fiche est inchange.
  const lat=Number(v.lat),lon=Number(v.lon);
  const situe=Number.isFinite(lat)&&Number.isFinite(lon)&&(lat||lon)&&
    Math.abs(lat)<=90&&Math.abs(lon)<=180;
  // Un cadrage de quartier : a la latitude de Brive, un degre de longitude
  // vaut environ 79 km et un degre de latitude 111 km — d ou ces deux deltas
  // dissemblables pour une fenetre d a peu pres 700 m sur 440. Assez pour
  // reconnaitre les rues autour sans avoir a chercher le point.
  const bbox=situe?[(lon-0.0045).toFixed(6),(lat-0.002).toFixed(6),
    (lon+0.0045).toFixed(6),(lat+0.002).toFixed(6)].join(","):"";
  const carte=situe?`<section class="pad section">
    <div class="section-head" style="margin-bottom:18px"><h2>Où c'est</h2></div>
    <div class="carte">
      <iframe title="Carte de ${echapper(v.nom)}" loading="lazy"
        src="https://www.openstreetmap.org/export/embed.html?bbox=${bbox}&amp;layer=mapnik&amp;marker=${lat},${lon}"></iframe>
    </div>
    ${iti?`<a href="${echapper(iti)}" target="_blank" rel="noopener" class="mono lien" style="display:inline-block;margin-top:14px;font-size:11px;letter-spacing:.14em;color:var(--encre)">Ouvrir l'itinéraire ↗</a>`:""}
  </section>`:"";

  // Qui s entraine ici. Meme selection que le planning par site de la page
  // Horaires — creneauxDuSite() range par jour puis par heure — mais une autre
  // presentation : sur une fiche il n y a qu un lieu, sept colonnes n auraient
  // qu une ligne a remplir. Les seances se lisent donc de haut en bas, le jour
  // annonce une fois pour toutes celles qu il porte.
  const seances=creneauxDuSite(teams?.items||[],v.slug);
  let jourEnCours="";
  const rangees=seances.map(o=>{
    const tete=o.c.jour!==jourEnCours
      ?`<tr><td colspan="2" class="mono" style="background:var(--sable);font-size:11px;letter-spacing:.18em">${echapper(o.c.jour)}</td></tr>`:"";
    jourEnCours=o.c.jour;
    const plage=plageCreneau(o.c);
    return tete+`<tr>
      <td style="white-space:nowrap;width:1%;font-weight:600">${echapper(plage||"—")}</td>
      <td>${o.e.slug?`<a class="lien" href="${teamUrl(o.e.slug)}">${echapper(o.e.nom)}</a>`:echapper(o.e.nom)}
        ${o.c.precision?`<span class="muted" style="font-size:12px;display:block;margin-top:2px">${echapper(o.c.precision)}</span>`:""}</td>
    </tr>`;
  }).join("");
  // Sans creneau, pas de section : un site peut n en porter aucun — le Beach
  // Park hors saison — et un tableau vide ne dirait rien de plus qu une absence.
  const creneaux=seances.length?`<section class="pad section">
    <div class="section-head"><h2>Qui s'y entraîne</h2><span class="mono">${seances.length} séance${seances.length>1?"s":""} par semaine</span></div>
    <!-- Pas de .table-wrap : sa regle impose 520 px de large aux tableaux qu il
         enveloppe, ce qui ferait defiler horizontalement deux colonnes tenant
         dans 375. Elle sert aux tableaux larges, pas a celui-ci. -->
    <table class="ds">${rangees}</table>
    <a class="mono lien" href="horaires.html#planning-salles" style="display:inline-block;margin-top:16px;font-size:11px;letter-spacing:.14em;color:var(--encre)">Le planning de tous les sites →</a>
  </section>`:"";

  const description=v.description
    ?`<section class="pad section"><div style="max-width:70ch">${mdToHtml(v.description)}</div></section>`
    :"";

  // Les blocs alternent image a gauche puis a droite. Un bloc sans photo
  // occupe toute la largeur plutot que de laisser une colonne vide, et un
  // bloc sans titre ni texte est ignore : Decap laisse facilement une entree
  // a moitie remplie.
  const blocs=(v.blocs||[]).filter(b=>b.titre||b.texte||b.photo).map((b,i)=>{
    const texte=`<div class="pad"><h2>${echapper(b.titre)}</h2>${b.texte?`<div class="muted" style="margin-top:14px">${mdToHtml(b.texte)}</div>`:""}</div>`;
    if(!b.photo)return `<section class="section">${texte}</section>`;
    const image=`<div><img src="${echapper(b.photo)}" alt="${echapper(b.titre||v.nom)}" loading="lazy" style="display:block;width:100%;height:100%;min-height:260px;object-fit:cover"></div>`;
    return `<section class="section split">${i%2===0?image+texte:texte+image}</section>`;
  }).join("");

  // Galerie legendee. <figure> et <figcaption> plutot que des div : la legende
  // appartient a son image, et le dire en HTML evite d inventer une classe que
  // la galerie du design system devrait ensuite documenter.
  // Une entree sans image est ignoree — une legende seule n a rien a montrer.
  const avecImage=(v.photos||[]).filter(p=>p.image);
  const galerie=avecImage.length?`<section class="section pad" id="galerie-gym">
    <div class="section-head"><h2>En images</h2><span class="mono">${avecImage.length} photo${avecImage.length>1?"s":""}</span></div>
    <div class="cols-3">${avecImage.map(p=>`
      <figure style="margin:0">
        <div class="ph" style="aspect-ratio:16/9;position:relative;overflow:hidden;border:2px solid var(--encre)">${vignette(p.image,p.legende||v.nom)}</div>
        ${p.legende?`<figcaption class="mono" style="font-size:11px;letter-spacing:.12em;margin-top:10px;text-transform:none">${echapper(p.legende)}</figcaption>`:""}
      </figure>`).join("")}</div>
  </section>`:"";

  el.innerHTML=entete+carte+creneaux+description+blocs+galerie;
  initLightbox("galerie-gym",avecImage.map(p=>({src:p.image,legende:p.legende})));
};
</script></body></html>
