<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gymnase — C.A. Brive Corrèze Volley</title>
<meta name="description" content="80 ans de volley au cœur de la Gaillarde. Équipes, calendrier, adhésion — rejoins la maison.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="C.A. Brive Corrèze Volley">
<meta property="og:title" content="Nos gymnases — C.A. Brive Corrèze Volley">
<meta property="og:description" content="80 ans de volley au cœur de la Gaillarde. Équipes, calendrier, adhésion — rejoins la maison.">
<meta property="og:image" content="https://cabc-volley.nkobrs21.workers.dev/assets/partage.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="assets/style.css">
</head><body>
<div id="header"></div>
<main id="main">
<div id="gymnase"></div>
</main>
<div id="footer"></div><script src="assets/site.js"></script>
<script>
window.__pageInit=async function(){
  const slug=new URLSearchParams(location.search).get("g");
  const data=await getJSON("content/gymnases.json");
  const el=document.getElementById("gymnase");
  const v=(data?.items||[]).find(x=>x.slug&&x.slug===slug);
  if(!v){el.innerHTML='<section class="pad section"><p class="muted">Site introuvable. <a href="contact.html" class="lien">Retour à nos gymnases</a></p></section>';return;}
  titrePage(v.nom);

  // Le bouton d itineraire ne parait que si l adresse saisie passe lienSur() :
  // salleCard() applique deja la meme regle a ce meme champ, cette page ne la
  // contredit plus.
  const iti=lienSur(v.itineraire);
  const entete=`<section class="pad section">
    <div class="crumb"><a href="index.html">Accueil</a><span>/</span><a href="contact.html">Nos gymnases</a><span>/</span><span style="color:var(--encre)">${echapper(v.nom)}</span></div>
    <div class="section-head" style="margin-bottom:0"><h1 style="font-size:clamp(32px,7vw,72px)">${echapper(v.nom)}</h1>${v.etiquette?`<span class="badge" style="align-self:flex-end">${echapper(v.etiquette)}</span>`:""}</div>
    ${v.adresse?`<p class="mono" style="margin-top:12px;font-size:12px;letter-spacing:.14em;color:var(--taupe)">${echapper(v.adresse)}</p>`:""}
    ${v.photo
      ?`<img src="${echapper(v.photo)}" alt="${echapper(v.nom)}" style="display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border:2px solid var(--encre);margin-top:24px">`
      :'<div class="ph" style="aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;border:2px solid var(--encre);margin-top:24px"><span class="mono" style="color:var(--mention)">[ photo à venir ]</span></div>'}
    <div class="row" style="margin-top:22px;align-items:center;gap:24px">
      ${[v.usage,v.acces].filter(Boolean).length?`<span class="mono" style="font-size:11px;letter-spacing:.14em">${echapper([v.usage,v.acces].filter(Boolean).join(" · "))}</span>`:""}
      ${iti?`<a href="${echapper(iti)}" target="_blank" rel="noopener" class="btn btn-secondary" style="padding:9px 20px">Itinéraire ↗</a>`:""}
    </div>
  </section>`;

  const description=v.description
    ?`<section class="pad section"><div style="max-width:70ch">${mdToHtml(v.description)}</div></section>`
    :"";

  // Les blocs alternent image a gauche puis a droite. Un bloc sans photo
  // occupe toute la largeur plutot que de laisser une colonne vide, et un
  // bloc sans titre ni texte est ignore : Decap laisse facilement une entree
  // a moitie remplie.
  const blocs=(v.blocs||[]).filter(b=>b.titre||b.texte||b.photo).map((b,i)=>{
    const texte=`<div class="pad"><h2>${echapper(b.titre)}</h2>${b.texte?`<div class="muted" style="margin-top:14px">${mdToHtml(b.texte)}</div>`:""}</div>`;
    if(!b.photo)return `<section class="section">${texte}</section>`;
    const image=`<div><img src="${echapper(b.photo)}" alt="${echapper(b.titre||v.nom)}" loading="lazy" style="display:block;width:100%;height:100%;min-height:260px;object-fit:cover"></div>`;
    return `<section class="section split">${i%2===0?image+texte:texte+image}</section>`;
  }).join("");

  // Galerie legendee. <figure> et <figcaption> plutot que des div : la legende
  // appartient a son image, et le dire en HTML evite d inventer une classe que
  // la galerie du design system devrait ensuite documenter.
  // Une entree sans image est ignoree — une legende seule n a rien a montrer.
  const avecImage=(v.photos||[]).filter(p=>p.image);
  const galerie=avecImage.length?`<section class="section pad" id="galerie-gym">
    <div class="section-head"><h2>En images</h2><span class="mono">${avecImage.length} photo${avecImage.length>1?"s":""}</span></div>
    <div class="cols-3">${avecImage.map(p=>`
      <figure style="margin:0">
        <div class="ph" style="aspect-ratio:16/9;position:relative;overflow:hidden;border:2px solid var(--encre)">${vignette(p.image,p.legende||v.nom)}</div>
        ${p.legende?`<figcaption class="mono" style="font-size:11px;letter-spacing:.12em;margin-top:10px;text-transform:none">${echapper(p.legende)}</figcaption>`:""}
      </figure>`).join("")}</div>
  </section>`:"";

  el.innerHTML=entete+description+blocs+galerie;
  initLightbox("galerie-gym",avecImage.map(p=>({src:p.image,legende:p.legende})));
};
</script></body></html>
