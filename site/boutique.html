<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Boutique — C.A. Brive Corrèze Volley</title>
<meta name="description" content="Maillots et produits du club, retrait au gymnase.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="C.A. Brive Corrèze Volley">
<meta property="og:title" content="Porte les couleurs — C.A. Brive Corrèze Volley">
<meta property="og:description" content="Maillots et produits du club, retrait au gymnase.">
<meta property="og:image" content="https://cabc-volley.nkobrs21.workers.dev/assets/partage.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="assets/style.css">
</head><body>
<div id="header"></div>
<main id="main">
<section class="pad section">
  <div class="crumb"><a href="index.html">Accueil</a><span>/</span><span style="color:var(--encre)">Boutique</span></div>
  <div class="section-head" style="margin-bottom:0"><h1 style="font-size:clamp(56px,9vw,88px)" id="b-titre"></h1><span class="mono" id="b-mention" style="align-self:flex-end"></span></div>
</section>
<section class="section dark pad" id="b-bandeau" style="padding-top:22px;padding-bottom:22px;display:none">
  <div class="row" id="b-bandeau-corps" style="align-items:center;gap:20px"></div>
</section>
<section class="pad" style="padding-bottom:0">
  <div class="commander">
    <strong class="display-l" style="font-weight:900;text-transform:uppercase;line-height:1" id="cmd-titre"></strong>
    <span class="muted" style="font-size:13px;line-height:1.6" id="cmd-texte"></span>
    <div style="display:flex;flex-direction:column;gap:8px;align-items:center">
      <a id="cmd-tel" class="btn btn-primary" style="padding:10px 20px;font-size:16px"></a>
      <a href="contact.html" class="mono lien" style="font-size:11px;color:var(--encre)">Nous écrire →</a>
    </div>
  </div>
</section>
<section class="section pad"><div id="products" class="cols-4"></div></section>
<section class="section band" id="b-etapes" style="display:none"></section>
</main>
<div id="footer"></div><script src="assets/site.js"></script>
<script>
window.__pageInit=async function(){
  const [data,settings]=await Promise.all([getJSON("content/products.json"),getJSON("content/settings.json")]);
  // Le champ telephone tient deux numeros separes par «/» : on compose le
  // premier, et le bouton disparait plutot que d afficher un lien mort.
  const tel=(settings?.telephone||"").split("/")[0].trim();
  const bt=document.getElementById("cmd-tel");
  if(tel){bt.textContent=tel;bt.href="tel:+33"+tel.replace(/\s/g,"").slice(1);}else bt.remove();
  // Le titre se coupe la ou le bureau passe a la ligne.
  const nl=v=>echapper(v).replace(/\n/g,"<br>");
  document.getElementById("b-titre").innerHTML=nl(data?.titre||"Boutique");
  const mention=document.getElementById("b-mention");
  if(data?.mention)mention.textContent=data.mention; else mention.remove();

  // Le bandeau disparait avec son texte : c est ainsi qu on retire une
  // operation terminee sans toucher au code. Il a porte « jusqu en juin »
  // plusieurs mois apres juin, faute de pouvoir etre efface depuis Decap.
  const ban=data?.bandeau||{};
  if(ban.texte&&ban.texte.trim()){
    document.getElementById("b-bandeau-corps").innerHTML=
      (ban.badge?`<span class="badge badge-outline" style="border-color:var(--creme);color:var(--creme)">${echapper(ban.badge)}</span>`:"")
      +`<strong style="font-family:'Barlow Condensed';font-weight:900;font-size:clamp(20px,3vw,30px)">${echapper(ban.texte)}</strong>`;
    document.getElementById("b-bandeau").style.display="";
  }

  const cmd=data?.commander||{};
  document.getElementById("cmd-titre").innerHTML=nl(cmd.titre||"");
  // L horaire de permanence n est saisi que dans Reglages. Le bureau place
  // {permanence} dans sa phrase ; le recopier en ferait une seconde version a
  // corriger le jour ou la permanence change.
  const heures=(settings?.permanence||"").trim();
  document.getElementById("cmd-texte").textContent=
    (cmd.texte||"").replace(/\{permanence\}/g,heures).replace(/\s{2,}/g," ").trim();
  const badge={nouveau:'<span class="badge" style="position:absolute;top:12px;left:12px">Nouveau</span>',epuise:'',dispo:''};
  // Les epuises passent en fin de grille. Le tri est stable, donc l ordre voulu
  // par le bureau dans Decap survit a l interieur de chaque groupe.
  const items=(data?.items||[]).slice().sort((a,b)=>(a.statut==="epuise")-(b.statut==="epuise"));
  document.getElementById("products").innerHTML=items.map(p=>{
    const off=p.statut==="epuise";
    return `<div class="card ${off?'':'shadow'}" style="${off?'border-color:var(--taupe);opacity:.75':''}">
      <div class="ph" style="aspect-ratio:1/1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden">${p.image?`<img src="${echapper(p.image)}" alt="${echapper(p.nom)}" loading="lazy" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover${off?';filter:grayscale(1)':''}">`:`<span class="mono" style="color:var(--mention)">[ ${echapper(p.nom)} ]</span>`}${badge[p.statut]||''}</div>
      <div class="body"><strong class="display-s" style="font-weight:900;text-transform:uppercase;line-height:1;${off?'color:var(--taupe)':''}">${echapper(p.nom)}</strong>
      <div class="row" style="justify-content:space-between;align-items:baseline"><span class="mono" style="font-size:15px;${off?'color:var(--taupe)':'color:var(--encre)'}">${echapper(p.prix)}</span>${off?'<span class="badge badge-muted">Épuisé</span>':'<span class="mono" style="font-size:10px;letter-spacing:.14em">'+echapper(p.detail)+'</span>'}</div></div></div>`;
  }).join("");

  // Le numero suit le rang : le donner a saisir ferait renumeroter la bande
  // des qu une etape s intercale.
  const etapes=(data?.etapes||[]).filter(e=>e&&(e.titre||e.texte));
  if(etapes.length){
    const bande=document.getElementById("b-etapes");
    bande.style.setProperty("--n",etapes.length);
    bande.innerHTML=etapes.map((e,i)=>`<div class="pad" style="display:flex;flex-direction:column;gap:10px">
      <strong class="display-2xl" style="font-weight:900;color:var(--lin);line-height:1">${String(i+1).padStart(2,"0")}</strong>
      <strong class="display-m" style="font-weight:900;text-transform:uppercase">${echapper(e.titre||"")}</strong>
      <span class="muted" style="font-size:14px">${echapper(e.texte||"")}</span></div>`).join("");
    bande.style.display="";
  }
};
</script></body></html>
