<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Accès au gymnase — C.A. Brive Corrèze Volley</title>
<meta name="description" content="Adresses, accès et itinéraires des sites où le club s'entraîne et reçoit.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="C.A. Brive Corrèze Volley">
<meta property="og:title" content="Accès au gymnase — C.A. Brive Corrèze Volley">
<meta property="og:description" content="Adresses, accès et itinéraires des sites où le club s'entraîne et reçoit.">
<meta property="og:image" content="https://cabc-volley.nkobrs21.workers.dev/assets/partage.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="assets/style.css">
</head><body>
<div id="header"></div>
<main id="main">
<section class="pad section">
  <div class="crumb"><a href="index.html">Accueil</a><span>/</span><span style="color:var(--encre)">Accès au gymnase</span></div>
  <div class="section-head" style="margin-bottom:0"><h1 style="font-size:clamp(38px,9vw,88px)">Accès<br>au gymnase</h1><span class="mono" id="gym-sub" style="align-self:flex-end"></span></div>
</section>
<section class="section pad">
  <img src="assets/carte-gymnases.webp" width="1200" height="515" loading="lazy"
       alt="Carte de Brive-la-Gaillarde situant les quatre sites du club : 1 Gymnase Rollinat, 2 Beach Park de Tujac, 3 Saint-Germain, 4 Arsonval."
       style="display:block;width:100%;height:auto;border:2px solid var(--encre);margin-bottom:26px">
  <div id="salles" class="cols-2"></div>
</section>
<section class="section pad">
  <div class="row">
    <a class="btn btn-secondary" href="horaires.html">Les créneaux d'entraînement →</a>
    <a class="btn btn-secondary" href="contact.html">Nous écrire →</a>
  </div>
</section>
</main>
<div id="footer"></div><script src="assets/site.js"></script>
<script>
window.__pageInit=async function(){
  const data=await getJSON("content/gymnases.json");
  const salles=data?.items||[];
  // textContent et non innerHTML : le secteur est un champ saisi, et le compte
  // se lit mieux colle au titre qu en tete de grille.
  document.getElementById("gym-sub").textContent=[salles.length+(salles.length>1?" sites":" site"),data?.secteur].filter(Boolean).join(" · ");

  // Fiche sans photo, contrairement a salleCard() : cette page repond a « ou
  // est-ce et comment j y vais », et le lien d itineraire doit vivre dans la
  // carte. salleCard() enveloppe la sienne dans un <a> des qu il y a un slug,
  // ou un second lien serait du HTML invalide.
  const zone=document.getElementById("salles");
  zone.className=salles.length?"cols-2":"";
  zone.innerHTML=salles.length?salles.map(v=>{
    // Une adresse d itineraire refusee fait disparaitre le lien plutot que de
    // le laisser pointer dans le vide.
    const iti=lienSur(v.itineraire);
    return `<div class="card shadow"><div class="body" style="padding:26px;gap:12px">
      ${v.etiquette?`<span class="badge" style="align-self:flex-start">${echapper(v.etiquette)}</span>`:""}
      <strong class="display-m" style="font-weight:900;text-transform:uppercase;line-height:1.05">${v.slug?`<a class="lien" href="${gymnaseUrl(v.slug)}">${echapper(v.nom)}</a>`:echapper(v.nom)}</strong>
      ${v.adresse?`<span class="muted" style="font-size:14px">${echapper(v.adresse)}</span>`:""}
      ${v.usage?`<span class="muted" style="font-size:13px">${echapper(v.usage)}</span>`:""}
      ${v.acces?`<span class="mono" style="font-size:10px;letter-spacing:.12em">${echapper(v.acces)}</span>`:""}
      ${iti?`<a class="mono lien" style="align-self:flex-start;font-size:11px;color:var(--encre);margin-top:4px" href="${echapper(iti)}" target="_blank" rel="noopener">Itinéraire ↗</a>`:""}
    </div></div>`;
  }).join(""):'<p class="vide muted">Les sites seront renseignés prochainement.</p>';
};
</script></body></html>
