<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FAQ — C.A. Brive Corrèze Volley</title>
<meta name="description" content="Coût de la licence, documents à fournir, séance d'essai : les questions qu'on nous pose le plus.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="C.A. Brive Corrèze Volley">
<meta property="og:title" content="Questions fréquentes — C.A. Brive Corrèze Volley">
<meta property="og:description" content="Coût de la licence, documents à fournir, séance d'essai : les questions qu'on nous pose le plus.">
<meta property="og:image" content="https://cabc-volley.nkobrs21.workers.dev/assets/partage.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="assets/style.css">
</head><body>
<div id="header"></div>
<main id="main">
<section class="pad section">
  <div class="crumb"><a href="index.html">Accueil</a><span>/</span><span style="color:var(--encre)">FAQ</span></div>
  <h1 style="font-size:clamp(38px,9vw,88px)">Questions<br>fréquentes</h1>
</section>
<section class="section pad">
  <div class="section-head"><h2 id="faq-titre"></h2><span class="mono" id="faq-compteur"></span></div>
  <div id="faq-liste"></div>
</section>
<section class="section pad">
  <div class="row">
    <a class="btn btn-primary" href="contact.html">Poser une autre question →</a>
    <a class="btn btn-secondary" href="adhesion.html">Rejoindre le club →</a>
  </div>
</section>
</main>
<div id="footer"></div><script src="assets/site.js"></script>
<script>
window.__pageInit=async function(){
  const faq=await getJSON("content/faq.json")||{};
  // Une entree sans question n a rien a ouvrir : elle quitte la liste plutot que
  // de poser un accordeon au titre vide.
  const items=(faq.items||[]).filter(q=>q.question);
  document.getElementById("faq-titre").textContent=faq.titre||"Questions fréquentes";
  document.getElementById("faq-compteur").textContent=items.length?items.length+" question"+(items.length>1?"s":""):"";
  // La premiere reponse s ouvre, comme sur la page Adhesion : le visiteur voit
  // tout de suite a quoi ressemble une reponse.
  document.getElementById("faq-liste").innerHTML=items.length?items.map((q,i)=>`
    <details class="acc"${i===0?" open":""}>
      <summary>${echapper(q.question)}</summary>
      <div class="acc-body muted">${mdToHtml(q.reponse)}</div>
    </details>`).join(""):'<p class="vide muted">Aucune question publiée pour le moment.</p>';
};
</script></body></html>
