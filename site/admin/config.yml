# Configuration Decap CMS — CABC Volley
backend:
  name: github
  repo: nbresson/cabc-volley            # dépôt GitHub du site
  branch: main
  # Connecteur OAuth (worker Cloudflare) — voir decap-oauth-worker/README.md :
  base_url: https://cabc-decap-oauth.nkobrs21.workers.dev
  auth_endpoint: /auth

# Décommenter en local pour tester sans GitHub :
# local_backend: true

media_folder: "site/assets/uploads"     # où sont stockées les images téléversées
public_folder: "assets/uploads"
site_url: https://www.cabc-volley.fr
locale: fr

collections:
  - name: news
    label: Actualités
    label_singular: Article
    files:
      - name: news
        label: Liste des actualités
        file: site/content/news.json
        fields:
          - name: items
            label: Articles
            label_singular: Article
            widget: list
            summary: "{{fields.titre}}"
            fields:
              - {name: titre, label: Titre, widget: string}
              - {name: date, label: Date, widget: datetime, format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false}
              - {name: categorie, label: Catégorie, widget: select, options: ["Résumé","Club","Jeunes"]}
              - {name: extrait, label: Chapô / extrait, widget: text}
              - {name: une, label: "À la une ?", widget: boolean, default: false, required: false}
              - {name: image, label: Image, widget: image, required: false, hint: "Photo : 1600 × 900 px (format paysage 16/9), moins de 400 Ko. Affiche carrée ou verticale : choisissez « Affiche » juste en dessous."}
              - name: cadrage
                label: Affichage de l'image
                widget: select
                required: false
                default: remplir
                hint: "« Photo » recadre l'image pour remplir le cadre. « Affiche » la montre en entier, sans jamais la couper."
                options:
                  - {label: "Photo — remplit le cadre, recadrée au centre", value: remplir}
                  - {label: "Affiche — image entière, jamais coupée", value: entier}
              - {name: slug, label: Identifiant URL, widget: string, hint: "sans espaces, ex. victoire-limoges"}
              - {name: corps, label: Contenu de l'article, widget: markdown, required: false}

  - name: matches
    label: Matchs & résultats
    files:
      - name: matches
        label: Matchs
        file: site/content/matches.json
        fields:
          - name: items
            label: Matchs
            label_singular: Match
            widget: list
            summary: "{{fields.adversaire}} — {{fields.date}}"
            fields:
              - {name: date, label: Date & heure, widget: datetime, format: "YYYY-MM-DDTHH:mm"}
              - {name: adversaire, label: Adversaire, widget: string}
              - {name: competition, label: Compétition, widget: string}
              # Si la liste déroulante Équipe reste vide ou en erreur : le widget
              # relation ne sait pas cibler une liste imbriquée dans une collection
              # files. Repli — remplacer tout ce bloc par :
              # {name: equipe, label: Équipe, widget: string, required: false, hint: "Identifiant de l'équipe, ex. n3-masculin. Recopiez-le depuis « Équipes & effectifs »."}
              - name: equipe
                label: Équipe
                widget: relation
                collection: teams
                file: teams
                required: false
                value_field: "items.*.slug"
                search_fields: ["items.*.nom"]
                display_fields: ["items.*.nom"]
                hint: "Nécessaire pour que le match apparaisse sur la page de l'équipe. Sans équipe, il reste affiché sur la page Calendrier."
              - {name: lieu, label: Lieu, widget: string}
              - {name: domicile, label: "À domicile ?", widget: boolean, default: true}
              - {name: statut, label: Statut, widget: select, options: ["a_venir","termine"], default: "a_venir"}
              - {name: score, label: Score (si terminé), widget: string, required: false, hint: "Format court, ex. 3-1. Le détail des sets n'est pas affiché."}
              - {name: gagne, label: "Victoire ?", widget: boolean, default: false, required: false, hint: "À cocher pour une victoire. Si elle reste décochée, la rencontre s'affiche « Défaite » sur la page de l'équipe."}
              - {name: une, label: "Match à la une ?", widget: boolean, default: false, required: false}

  - name: classement
    label: Classement
    files:
      - name: classement
        label: Classement du championnat
        file: site/content/classement.json
        fields:
          - {name: titre, label: Titre de la section, widget: string, hint: "Affiché au-dessus du tableau, ex. Classement Prénationale F"}
          - {name: note, label: Phrase sous le tableau, widget: text, required: false, hint: "Laissez vide pour ne rien afficher sous le tableau."}
          - name: items
            label: Lignes du classement
            label_singular: Équipe
            widget: list
            summary: "{{fields.equipe}} — {{fields.points}} pts"
            hint: "Le rang n'est pas à saisir : c'est l'ordre de cette liste. Faites glisser une ligne pour la déplacer. Sans aucune ligne, la page affiche « Classement à venir »."
            fields:
              - {name: equipe, label: Équipe, widget: string}
              - {name: joues, label: Matchs joués (J), widget: number, value_type: int, min: 0, default: 0}
              - {name: victoires, label: Victoires (V), widget: number, value_type: int, min: 0, default: 0}
              - {name: defaites, label: Défaites (D), widget: number, value_type: int, min: 0, default: 0}
              - {name: points, label: Points (Pts), widget: number, value_type: int, min: 0, default: 0}
              - {name: notre_club, label: "Notre club ?", widget: boolean, default: false, required: false, hint: "Met la ligne en avant sur fond sable. À cocher sur une seule ligne."}

  - name: teams
    label: Équipes & effectifs
    files:
      - name: teams
        label: Équipes
        file: site/content/teams.json
        fields:
          - name: items
            label: Équipes
            label_singular: Équipe
            widget: list
            summary: "{{fields.nom}}"
            fields:
              - {name: nom, label: Nom de l'équipe, widget: string}
              - {name: slug, label: Identifiant URL, widget: string, hint: "Sans espaces ni accents, en minuscules, ex. n3-masculin. Ne le modifiez plus une fois la page en ligne : les liens déjà partagés cesseraient de fonctionner."}
              - {name: groupe, label: Groupe, widget: select, options: ["Séniors","Jeunes","Formation","Loisir"], default: "Séniors", required: false, hint: "Regroupe les équipes sur la page Équipes, dans cet ordre. « Loisir » pour les pratiques sans compétition, comme le Volley Santé. Laissé vide, le groupe devient « Autres », affiché en dernier."}
              - {name: categorie, label: Catégorie / niveau, widget: string}
              - {name: creneau, label: Créneau, widget: string}
              - {name: photo, label: Photo d'équipe, widget: image, required: false, hint: "Paysage : 1600 × 900 px (format 16/9), moins de 400 Ko."}
              - {name: classement, label: Lien classement FFVB de l'équipe, widget: string, required: false, hint: "Chaque équipe a sa poule, donc son propre classement. Ouvrez le classement de cette équipe sur le site de la FFVB et collez ici l'adresse de la page. Laissé vide, le lien général des « Réglages du club » est utilisé — et seulement si l'équipe a des matchs."}
              - name: infos
                label: Infos pratiques
                widget: object
                collapsed: true
                required: false
                hint: "Pour les équipes sans calendrier de matchs : jeunes, école de volley. Laissez le titre vide pour ne rien afficher."
                fields:
                  - {name: titre, label: Titre, widget: string, required: false, hint: "Laissez vide pour masquer complètement le bloc."}
                  - {name: texte, label: Texte, widget: text, required: false}
                  - {name: bouton, label: Libellé du bouton, widget: string, required: false, hint: "Le bouton n'apparaît que si le libellé ET le lien sont remplis."}
                  - {name: lien, label: Lien du bouton, widget: string, required: false, hint: "Ex. adhesion.html ou contact.html"}
              - name: effectif
                label: Effectif
                label_singular: Joueur/joueuse
                widget: list
                required: false
                summary: "{{fields.num}} — {{fields.nom}}"
                fields:
                  - {name: num, label: Numéro, widget: string}
                  - {name: nom, label: Nom, widget: string}
                  - {name: poste, label: Poste, widget: string}
                  - {name: photo, label: Photo, widget: image, required: false, hint: "Portrait vertical : 900 × 1200 px (format 3/4), moins de 400 Ko. Cadrez le visage au centre."}

  - name: products
    label: Boutique
    files:
      - name: products
        label: Produits
        file: site/content/products.json
        fields:
          - name: items
            label: Produits
            label_singular: Produit
            widget: list
            summary: "{{fields.nom}} — {{fields.prix}}"
            fields:
              - {name: nom, label: Nom, widget: string}
              - {name: prix, label: Prix, widget: string}
              - {name: detail, label: Détail (tailles…), widget: string}
              - {name: statut, label: Statut, widget: select, options: ["dispo","nouveau","epuise"], default: "dispo"}
              - {name: image, label: Photo, widget: image, required: false, hint: "Carré : 1200 × 1200 px, moins de 400 Ko. Le produit doit être centré, il est recadré au centre."}

  - name: settings
    label: Réglages du club
    files:
      - name: settings
        label: Coordonnées & liens
        file: site/content/settings.json
        fields:
          - {name: club_nom, label: Nom du club, widget: string}
          - {name: ffvb_classement, label: Lien classement FFVB, widget: string}
          - {name: permanence, label: Permanence, widget: string}
          - {name: email, label: Email, widget: string}
          - {name: telephone, label: Téléphone, widget: string}
          - {name: instagram, label: Instagram (adresse), widget: string, required: false, hint: "Adresse complète de la page. Laissée vide, celle inscrite dans le code est conservée."}
          - {name: facebook, label: Facebook (adresse), widget: string, required: false, hint: "Adresse complète de la page. Laissée vide, celle inscrite dans le code est conservée."}

  - name: gymnases
    label: Gymnases
    files:
      - name: gymnases
        label: Nos gymnases
        file: site/content/gymnases.json
        fields:
          - {name: secteur, label: Secteur affiché, widget: string, required: false, hint: "Affiché à côté du nombre de salles, ex. Brive-la-Gaillarde"}
          - name: items
            label: Salles
            label_singular: Salle
            widget: list
            summary: "{{fields.nom}}"
            fields:
              - {name: nom, label: Nom, widget: string}
              - {name: slug, label: Identifiant URL, widget: string, required: false, hint: "Sans espaces ni accents, en minuscules, ex. rollinat. Rempli, la salle gagne sa propre page et sa carte devient cliquable. Laissé vide, la salle reste affichée mais sans page. Ne le modifiez plus une fois la page en ligne : les liens déjà partagés cesseraient de fonctionner."}
              - {name: etiquette, label: Étiquette, widget: string, required: false, hint: "Pastille affichée sur la photo, ex. Salle principale ou Beach. Laisser vide pour ne rien afficher."}
              - {name: adresse, label: Adresse, widget: string, required: false}
              - {name: usage, label: Ce qui s'y passe, widget: string, required: false, hint: "Ex. Matchs seniors · école de volley"}
              - {name: acces, label: Accès, widget: string, required: false, hint: "Ex. Parking gratuit · Bus ligne 4"}
              - {name: itineraire, label: Lien itinéraire, widget: string, required: false, hint: "Ouvrez la salle dans Google Maps, puis collez ici l'adresse de la page. Le bouton « Itinéraire » n'apparaît que si ce champ est rempli."}
              - {name: photo, label: Photo, widget: image, required: false, hint: "Paysage : 1600 × 1000 px (format 16/10), moins de 400 Ko."}
              - {name: description, label: Description, widget: text, required: false, hint: "Affichée sur la page de la salle, sous la grande photo. Un paragraphe par ligne vide. N'apparaît que si la salle a un identifiant URL."}
              - name: blocs
                label: Blocs de la page
                label_singular: Bloc
                widget: list
                required: false
                collapsed: true
                summary: "{{fields.titre}}"
                hint: "Sections ajoutées sous la description : les vestiaires, l'histoire de la salle, une galerie de photos… Les images alternent automatiquement à gauche puis à droite. Un bloc sans photo occupe toute la largeur."
                fields:
                  - {name: titre, label: Titre, widget: string, required: false}
                  - {name: texte, label: Texte, widget: text, required: false}
                  - {name: photo, label: Photo, widget: image, required: false, hint: "Paysage : 1600 × 1000 px, moins de 400 Ko."}
              - name: photos
                label: Photos de la salle
                label_singular: Photo
                widget: list
                required: false
                collapsed: true
                summary: "{{fields.legende}}"
                hint: "Galerie affichée tout en bas de la page, en trois colonnes. Chaque photo peut porter sa propre légende. Une entrée sans photo est ignorée."
                fields:
                  - {name: image, label: Photo, widget: image, hint: "Paysage : 1600 × 900 px (format 16/9), moins de 400 Ko."}
                  - {name: legende, label: Légende, widget: string, required: false, hint: "Ce qu'on voit sur la photo, ex. Les gradins un soir de match. Laissée vide, la photo s'affiche sans texte."}

  - name: club
    label: Page Club
    files:
      - name: club
        label: Contenu de la page
        file: site/content/club.json
        fields:
          - name: presentation
            label: Bandeau d'accueil & chiffres clés
            widget: object
            collapsed: true
            fields:
              - {name: eyebrow, label: Sur-titre, widget: string, required: false, hint: "Petite ligne au-dessus du titre, ex. Le Club · 1946 → 2026"}
              - {name: titre, label: Grand titre, widget: text, hint: "Passez à la ligne pour couper le titre en deux."}
              - {name: chapo, label: Texte d'introduction, widget: text}
              - name: chiffres
                label: Chiffres clés
                label_singular: Chiffre
                widget: list
                summary: "{{fields.valeur}} {{fields.libelle}}"
                hint: "Bandeau noir sous le titre. De 2 à 4 chiffres pour rester lisible."
                fields:
                  - {name: valeur, label: Nombre, widget: string}
                  - {name: libelle, label: Libellé, widget: string}
          - name: histoire
            label: Notre histoire
            widget: object
            collapsed: true
            fields:
              - {name: eyebrow, label: Sur-titre, widget: string, required: false}
              - {name: titre, label: Titre, widget: text, hint: "Passez à la ligne pour couper le titre en deux."}
              - {name: photo, label: Photo d'archive, widget: image, required: false, hint: "Paysage : 1600 × 900 px (format 16/9), moins de 400 Ko."}
              - {name: legende, label: Légende sous la photo, widget: string, required: false}
              - name: dates
                label: Dates clés
                label_singular: Date
                widget: list
                summary: "{{fields.annee}} — {{fields.texte}}"
                fields:
                  - {name: annee, label: Année, widget: string}
                  - {name: texte, label: Texte, widget: text, hint: "Encadrez un passage de deux astérisques pour le mettre en gras : **comme ceci**."}
                  - {name: une, label: "Mettre en avant ?", widget: boolean, default: false, required: false, hint: "Affiche la ligne sur fond sable. Réservez-le à une seule date."}
          - name: bureau
            label: Le bureau
            widget: object
            collapsed: true
            fields:
              - {name: titre, label: Titre de la section, widget: string}
              - {name: mention, label: Mention à droite du titre, widget: string, required: false, hint: "Ex. Élu en AG · juin 2026"}
              - name: membres
                label: Membres
                label_singular: Membre
                widget: list
                summary: "{{fields.nom}} — {{fields.role}}"
                fields:
                  - {name: nom, label: Nom, widget: string}
                  - {name: role, label: Rôle, widget: string}
                  - {name: photo, label: Portrait, widget: image, required: false, hint: "Portrait vertical : 900 × 1200 px (format 3/4), moins de 400 Ko."}
              - name: appel
                label: Encart « appel aux bénévoles »
                widget: object
                collapsed: true
                fields:
                  - {name: titre, label: Titre, widget: string, required: false, hint: "Laissez vide pour masquer complètement l'encart."}
                  - {name: texte, label: Texte, widget: text, required: false}
                  - {name: bouton, label: Libellé du bouton, widget: string, required: false}
                  - {name: lien, label: Lien du bouton, widget: string, required: false, hint: "Ex. contact.html ou adhesion.html"}
          - name: galerie
            label: La vie du club
            widget: object
            collapsed: true
            fields:
              - {name: titre, label: Titre de la section, widget: string}
              - {name: legende, label: Mention à droite du titre, widget: string, required: false}
              - name: photos
                label: Photos
                label_singular: Photo
                widget: list
                required: false
                hint: "Paysage : 1600 × 900 px (format 16/9), moins de 400 Ko chacune. Par multiples de 3 pour des rangées pleines."
                field: {name: image, label: Photo, widget: image}

  - name: adhesion
    label: Page Adhésion
    files:
      - name: adhesion
        label: Page Adhésion
        file: site/content/adhesion.json
        fields:
          - name: bandeau
            label: "Bandeau d'accueil"
            widget: object
            fields:
              - {name: eyebrow, label: Surtitre, widget: string, required: false, hint: "Ex. — Saison 2026–2027"}
              - {name: titre, label: Titre, widget: text, hint: "Un retour à la ligne coupe le titre en deux — c'est ce qui lui donne son allure."}
              - {name: chapo, label: Chapô, widget: text, required: false}
              - name: tarifs
                label: Tarifs
                label_singular: Tarif
                widget: list
                required: false
                summary: "{{fields.montant}} — {{fields.libelle}}"
                hint: "Affichés deux par ligne. En nombre impair, le dernier occupe toute la largeur."
                fields:
                  - {name: montant, label: Montant, widget: string, hint: "Ex. 120 €"}
                  - {name: libelle, label: "Ce qu'il couvre", widget: string, hint: "Ex. Jeunes / Loisir"}
          - name: etapes
            label: Les trois étapes
            label_singular: Étape
            widget: list
            required: false
            summary: "{{fields.titre}}"
            hint: "Le numéro (01, 02…) vient du rang : inutile de le saisir, il se renumérote tout seul quand vous en ajoutez une."
            fields:
              - {name: titre, label: Titre, widget: string}
              - {name: texte, label: Texte, widget: text, required: false}
              - {name: lien_libelle, label: "Libellé du lien", widget: string, required: false, hint: "Facultatif. Le lien n'apparaît que si le libellé ET l'adresse sont remplis."}
              - {name: lien, label: Adresse du lien, widget: string, required: false, hint: "Ex. infos.html#essentiel"}
          - name: formulaire
            label: En-tête du formulaire
            widget: object
            hint: "Seuls le titre et l'introduction se modifient. Les champs du formulaire restent figés : ils portent la clé d'envoi et le libellé des emails reçus."
            fields:
              - {name: titre, label: Titre, widget: string, required: false}
              - {name: chapo, label: "Texte d'introduction", widget: text, required: false}
          - name: faq
            label: "« Avant de te lancer » — les questions fréquentes"
            widget: object
            hint: "Le bloc dépliant en bas de la page Adhésion. Sans aucune question, il disparaît entièrement."
            fields:
              - {name: titre, label: Titre de la section, widget: string, required: false, hint: "Par défaut : Avant de te lancer"}
              - name: items
                label: Questions
                label_singular: Question
                widget: list
                required: false
                summary: "{{fields.question}}"
                fields:
                  - {name: question, label: Question, widget: string, hint: "Elle s'affiche en majuscules, gardez-la courte."}
                  - {name: reponse, label: Réponse, widget: text, required: false, hint: "Un lien s'écrit [texte](page.html), du gras **entre deux étoiles**. Une ligne vide sépare deux paragraphes."}
  - name: legal
    label: Mentions légales
    files:
      - name: legal
        label: Mentions légales
        file: site/content/legal.json
        fields:
          - {name: maj, label: Dernière mise à jour, widget: datetime, format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false}
          - name: editeur
            label: Éditeur du site
            widget: object
            hint: "L'email et le téléphone affichés sur la page viennent des « Réglages du club »."
            fields:
              - {name: denomination, label: Dénomination officielle, widget: string}
              - {name: statut, label: Statut juridique, widget: string}
              - {name: adresse, label: Siège social, widget: string, required: false, hint: "Adresse complète, ex. 12 rue Lavoisier, 19100 Brive-la-Gaillarde"}
              - {name: rna, label: N° RNA, widget: string, required: false, hint: "N° de déclaration en préfecture, format W19xxxxxxx"}
              - {name: siret, label: N° SIRET, widget: string, required: false}
              - {name: directeur_publication, label: Directeur de publication, widget: string, required: false, hint: "En général le président ou la présidente du club"}
          - name: hebergeur
            label: Hébergeur
            widget: object
            hint: "À ne modifier que si le site change d'hébergeur."
            fields:
              - {name: nom, label: Nom, widget: string}
              - {name: adresse, label: Adresse, widget: string}
              - {name: site, label: Site web, widget: string}
          - name: articles
            label: Articles
            label_singular: Article
            widget: list
            summary: "{{fields.titre}}"
            fields:
              - {name: titre, label: Titre, widget: string}
              - {name: corps, label: Texte, widget: markdown}

  - name: infos
    label: Infos & documents
    files:
      - name: infos
        label: Contenu de la page
        file: site/content/infos.json
        fields:
          - {name: titre, label: Titre de la page, widget: string}
          - {name: chapo, label: Texte d'introduction, widget: text, required: false}
          - name: blocs
            label: Blocs
            label_singular: Bloc
            widget: list
            collapsed: true
            required: false
            summary: "{{fields.titre}}"
            hint: "Chaque bloc est une section de la page : un titre, du texte, et autant de documents ou de liens que nécessaire."
            fields:
              - {name: titre, label: Titre du bloc, widget: string}
              - {name: texte, label: Texte, widget: markdown, required: false}
              - name: documents
                label: Documents et liens
                label_singular: Document ou lien
                widget: list
                collapsed: true
                required: false
                types:
                  - name: fichier
                    label: Document téléversé
                    widget: object
                    summary: "{{fields.libelle}}"
                    fields:
                      - {name: libelle, label: Libellé du bouton, widget: string, hint: "Ce que lit le visiteur, ex. Fiche d'inscription"}
                      - {name: fichier, label: Fichier, widget: file, media_folder: "/site/assets/documents", public_folder: "/assets/documents", hint: "PDF de préférence, moins de 2 Mo. Pour une mise à jour, remplacez le fichier existant plutôt que d'en téléverser un nouveau : chaque version reste définitivement dans l'historique du dépôt."}
                      - {name: langue, label: Langue, widget: select, options: ["FR","EN"], required: false, hint: "Affichée en pastille à côté du format. Inutile pour un document en français sans ambiguïté."}
                  - name: lien
                    label: Lien externe
                    widget: object
                    summary: "{{fields.libelle}}"
                    fields:
                      - {name: libelle, label: Libellé du bouton, widget: string, hint: "Ce que lit le visiteur, ex. Formulaire de licence FFVB"}
                      - {name: url, label: Adresse du lien, widget: string, hint: "Collez l'adresse complète, avec https://. Le lien s'ouvrira dans un nouvel onglet."}
                      - {name: langue, label: Langue, widget: select, options: ["FR","EN"], required: false, hint: "Affichée en pastille à côté du format. Inutile pour un document en français sans ambiguïté."}
                  - name: intertitre
                    label: Intertitre
                    widget: object
                    summary: "— {{fields.libelle}}"
                    fields:
                      - {name: libelle, label: Libellé, widget: string, hint: "Trace une ligne de section au fil de la liste, ex. Certificats médicaux. Ne compte pas comme un document."}

          - name: essentiel
            label: L'essentiel (bloc sombre en haut de page)
            widget: object
