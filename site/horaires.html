<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Horaires — C.A. Brive Corrèze Volley</title>
<meta name="description" content="Les créneaux d'entraînement de toutes les équipes du club, des seniors à l'école de volley.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="C.A. Brive Corrèze Volley">
<meta property="og:title" content="Horaires d'entraînement — C.A. Brive Corrèze Volley">
<meta property="og:description" content="Les créneaux d'entraînement de toutes les équipes du club, des seniors à l'école de volley.">
<meta property="og:image" content="https://cabc-volley.nkobrs21.workers.dev/assets/partage.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="assets/style.css">
</head><body>
<div id="header"></div>
<main id="main">
<section class="pad section">
  <div class="crumb"><a href="index.html">Accueil</a><span>/</span><span style="color:var(--encre)">Horaires</span></div>
  <div class="section-head" style="margin-bottom:0"><h1 style="font-size:clamp(38px,9vw,88px)">Horaires</h1><span class="mono" id="compteur" style="align-self:flex-end"></span></div>
  <nav class="ancres" id="ancres-groupes" aria-label="Groupes d'équipes" style="display:none"></nav>
</section>
<section class="section pad"><div id="horaires"></div></section>
<section class="section pad" id="planning-equipes" style="display:none">
  <div class="section-head"><h2>Planning par équipe</h2><span class="mono" id="equipes-note"></span></div>
  <div class="table-wrap"><table class="ds" id="planning"></table></div>
  <div id="legende" style="display:flex;flex-wrap:wrap;gap:10px 18px;margin-top:20px"></div>
</section>
<section class="section pad" id="planning-salles" style="display:none">
  <div class="section-head"><h2>Planning par site</h2><span class="mono" id="salles-note"></span></div>
  <div class="table-wrap"><table class="ds" id="planning-gymnases"></table></div>
</section>
<section class="section pad">
  <div class="row">
    <a class="btn btn-secondary" href="acces.html">Où sont les gymnases ? →</a>
    <a class="btn btn-secondary" href="equipes.html">Toutes nos équipes →</a>
  </div>
</section>
</main>
<div id="footer"></div><script src="assets/site.js"></script>
<script>
window.__pageInit=async function(){
  const teams=await getJSON("content/teams.json");
  const gymnases=await getJSON("content/gymnases.json");
  const items=teams?.items||[];

  const salles=parSalle(gymnases);

  // Le nom mene a la fiche d equipe quand elle existe. Une equipe sans slug
  // reste dans le tableau sans lien mort, comme sur la page Equipes.
  // La categorie tient sous le nom plutot que dans sa propre colonne : a trois
  // colonnes, l horaire — la seule chose qu on vient chercher ici — sortait de
  // l ecran d un telephone et se lisait a la barre de defilement.
  const rangee=t=>`<tr>
      <td><strong>${t.slug?`<a class="lien" href="${teamUrl(t.slug)}">${echapper(t.nom)}</a>`:echapper(t.nom)}</strong>
        ${t.categorie?`<br><span class="mono" style="font-size:10px;letter-spacing:.12em">${echapper(t.categorie)}</span>`:""}</td>
      <td>${phraseCreneaux(t,salles).map(c=>echapper(c)).join("<br>")||'<span class="muted">—</span>'}</td>
    </tr>`;

  // Meme regroupement que la page Equipes : l ordre connu d abord, un groupe
  // inconnu obtient quand meme sa section, et « Autres » ferme la marche.
  // Aucune equipe n est perdue, quelle que soit la valeur de groupe.
  const ORDRE=["Séniors","Jeunes","Formation","Loisir"];
  const groupes=new Map(ORDRE.map(g=>[g,[]]));
  const autres=[];
  items.forEach(t=>{
    const nom=typeof t.groupe==="string"?t.groupe.trim():"";
    if(!nom){autres.push(t);return;}
    if(!groupes.has(nom))groupes.set(nom,[]);
    groupes.get(nom).push(t);
  });
  if(groupes.has("Autres")||autres.length){
    const liste=[...(groupes.get("Autres")||[]),...autres];
    groupes.delete("Autres");
    groupes.set("Autres",liste);
  }

  // Le prefixe « g- » est aussi la cible de la regle scroll-margin-top, l en-tete
  // etant colle en haut de page.
  const slugAncre=s=>"g-"+s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-");
  const visibles=[...groupes].filter(([,l])=>l.length);
  // min-width:0 defait le plancher de 520 px que .table-wrap impose aux
  // tableaux : il protege les six colonnes d un classement, mais sur deux
  // colonnes il ne faisait que couper la fin des creneaux sur un telephone.
  const wrap=document.getElementById("horaires");
  wrap.innerHTML=visibles.length?visibles.map(([nom,liste])=>`
    <div style="margin-bottom:56px" id="${slugAncre(nom)}">
      <div class="section-head" style="margin-bottom:20px"><h2>${echapper(nom)}</h2><span class="mono">${liste.length} équipe${liste.length>1?"s":""}</span></div>
      <div class="table-wrap"><table class="ds" style="min-width:0"><thead><tr><th style="width:40%">Équipe</th><th>Créneaux</th></tr></thead>
      <tbody>${liste.map(rangee).join("")}</tbody></table></div>
    </div>`).join(""):'<p class="vide muted">Aucun créneau publié pour le moment.</p>';

  document.getElementById("compteur").textContent=items.length?items.length+" équipe"+(items.length>1?"s":""):"";
  // Un sommaire d un seul lien ne sert a rien.
  const ancres=document.getElementById("ancres-groupes");
  if(visibles.length>1){
    ancres.innerHTML=visibles.map(([nom])=>`<a href="#${slugAncre(nom)}">${echapper(nom)} ↓</a>`).join("");
    ancres.style.display="";
  }

  // Planning hebdomadaire. La couleur est portee par la salle et non par la
  // case : deux cases du meme gymnase ne peuvent donc pas se contredire, et la
  // legende ne peut pas dementir le tableau.
  // Les quatre teintes de la charte se ressemblent volontairement — trois
  // beiges et l encre. La couleur ne peut donc pas etre le seul repere : le nom
  // court de la salle est ecrit dans la case, comme pour l entree active du
  // menu, ou le trait seul ne suffisait pas.
  const TEINTES={creme:["var(--creme)","var(--encre)"],sable:["var(--sable)","var(--encre)"],
    lin:["var(--lin)","var(--encre)"],encre:["var(--encre)","var(--creme)"]};
  const equipes=(teams?.items||[]).filter(e=>creneauxDe(e).length);
  if(equipes.length){
    const utilisees=new Set();
    // Une seance par bloc, et non par case : le vendredi, les Regional 1
    // alternent entre deux salles. Deux blocs de deux couleurs disent
    // l alternance ; une case d une seule couleur en cacherait la moitie.
    const bloc=c=>{
      const v=salles[c.gymnase];
      if(v)utilisees.add(v.slug);
      const [fond,encre]=TEINTES[(v||{}).couleur]||TEINTES.creme;
      // Sans salle, le bloc reste sur le fond de la page : rien a signaler.
      const style=v?`background:${fond};color:${encre}`:"";
      const plage=plageCreneau(c);
      return `<div style="padding:11px 13px;${style}">`
        +(plage?`<strong style="font-weight:600">${echapper(plage)}</strong>`:"")
        +(v?`<span class="mono" style="font-size:10px;letter-spacing:.14em;display:block;margin-top:5px;opacity:.8;color:inherit">${echapper(v.court||v.nom)}</span>`:"")
        +(c.precision?`<span style="font-size:12px;line-height:1.35;display:block;margin-top:5px;opacity:.85">${echapper(c.precision)}</span>`:"")
        +`</div>`;
    };
    const cellule=(e,jour)=>{
      const cs=creneauxDe(e).filter(c=>c.jour===jour);
      if(!cs.length)return '<td></td>';
      // La couleur remplit le bloc et non la cellule, qui garde un liset de
      // fond sur ses quatre cotes. Sans lui, deux salles identiques cote a cote
      // — l UFOLEP le mercredi et le jeudi a Arsonval — se rejoignent en un seul
      // pave, et se lisent comme une seance de deux jours.
      return `<td style="padding:0 1px;vertical-align:top"><div style="display:grid;gap:2px">${cs.map(bloc).join("")}</div></td>`;
    };
    document.getElementById("planning").innerHTML=
      `<thead><tr><th>Équipe</th>${JOURS_SEMAINE.map(j=>`<th>${j}</th>`).join("")}</tr></thead>`+
      `<tbody>${equipes.map(e=>`<tr><td><a href="${teamUrl(e.slug)}" class="lien">${echapper(e.nom)}</a></td>${JOURS_SEMAINE.map(j=>cellule(e,j)).join("")}</tr>`).join("")}</tbody>`;
    document.getElementById("equipes-note").textContent=equipes.length+" équipes · saison 2026–2027";
    // La legende ne montre que les salles reellement employees : une salle sans
    // creneau n a rien a y faire.
    const leg=((gymnases?.items)||[]).filter(v=>utilisees.has(v.slug));
    document.getElementById("legende").innerHTML=leg.map(v=>{
      const [fond,encre]=TEINTES[v.couleur]||TEINTES.creme;
      return `<span style="display:inline-flex;align-items:baseline;gap:9px">
        <span aria-hidden="true" style="width:15px;height:15px;background:${fond};border:1px solid var(--encre);flex:none;align-self:center"></span>
        <span><strong style="font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.04em">${echapper(v.nom)}</strong>
        <span class="mono" style="font-size:11px;color:var(--taupe);display:block">${echapper(v.adresse||"")}</span></span></span>`;
    }).join("");
    document.getElementById("planning-equipes").style.display="";
  }

  // Le meme planning, pivote. Un membre du bureau ne cherche pas l horaire
  // d une equipe mais l occupation d une salle. La couleur reste a l en-tete
  // de ligne : la repeter dans chaque case n apprendrait rien, la ligne disant
  // deja quelle salle on lit.
  const parCase={};
  (teams?.items||[]).forEach(e=>creneauxDe(e).forEach(c=>{
    const k=(c.gymnase||"")+"|"+c.jour;
    (parCase[k]=parCase[k]||[]).push({c:c,e:e});
  }));
  if(Object.keys(parCase).length){
    const lignes=((gymnases?.items)||[]).slice();
    // Une seance sans salle n a aucune ligne ou aller. Plutot que la perdre —
    // le tableau paraitrait complet en taisant deux creneaux — elle obtient sa
    // propre ligne, qui dit au bureau ce qui reste a arreter.
    if(Object.keys(parCase).some(k=>k.charAt(0)==="|"))lignes.push({slug:"",nom:"Site non précisé"});
    const caseSalle=(v,jour)=>{
      const l=(parCase[v.slug+"|"+jour]||[]).slice()
        .sort((a,b)=>String(a.c.debut||"").localeCompare(String(b.c.debut||"")));
      if(!l.length)return "<td></td>";
      return `<td style="vertical-align:top"><div style="display:grid;gap:13px">${l.map(o=>{
        const plage=plageCreneau(o.c);
        return `<div>`
          +(plage?`<strong style="font-weight:600;display:block">${echapper(plage)}</strong>`:"")
          +`<span style="display:block;margin-top:3px">${echapper(o.e.nom)}</span>`
          +(o.c.precision?`<span style="font-size:12px;display:block;margin-top:2px;color:var(--taupe)">${echapper(o.c.precision)}</span>`:"")
          +`</div>`;
      }).join("")}</div></td>`;
    };
    // Une salle sans creneau garde sa ligne : pour qui regarde l occupation,
    // une salle inemployee est un renseignement, pas un vide a masquer.
    const rangeeSalle=v=>{
      const [fond,encre]=TEINTES[v.couleur]||["transparent","inherit"];
      const tete=`<td style="background:${fond};color:${encre};font-weight:600">${echapper(v.nom)}</td>`;
      const vide=JOURS_SEMAINE.every(j=>!(parCase[v.slug+"|"+j]||[]).length);
      return `<tr>${tete}${vide
        ?'<td colspan="7" class="muted">Aucun créneau cette saison</td>'
        :JOURS_SEMAINE.map(j=>caseSalle(v,j)).join("")}</tr>`;
    };
    document.getElementById("planning-gymnases").innerHTML=
      `<thead><tr><th>Site</th>${JOURS_SEMAINE.map(j=>`<th>${j}</th>`).join("")}</tr></thead>`+
      `<tbody>${lignes.map(rangeeSalle).join("")}</tbody>`;
    const nbSalles=((gymnases?.items)||[]).length;
    const nbSeances=Object.keys(parCase).reduce((n,k)=>n+parCase[k].length,0);
    document.getElementById("salles-note").textContent=
      nbSalles+" site"+(nbSalles>1?"s":"")+" · "+nbSeances+" séance"+(nbSeances>1?"s":"");
    document.getElementById("planning-salles").style.display="";
  }
};
</script></body></html>
