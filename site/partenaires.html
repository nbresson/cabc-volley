<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nos partenaires — C.A. Brive Corrèze Volley</title>
<meta name="description" content="Collectivités, commerces et entreprises qui font vivre le CAB. Et comment les rejoindre.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="C.A. Brive Corrèze Volley">
<meta property="og:title" content="Nos partenaires — C.A. Brive Corrèze Volley">
<meta property="og:description" content="Collectivités, commerces et entreprises qui font vivre le CAB. Et comment les rejoindre.">
<meta property="og:image" content="https://cabc-volley.nkobrs21.workers.dev/assets/partage.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="assets/style.css">
</head><body>
<div id="header"></div>
<main id="main">
<section class="pad section">
  <div class="crumb"><a href="index.html">Accueil</a><span>/</span><a href="club.html">Le Club</a><span>/</span><span style="color:var(--encre)">Partenaires</span></div>
  <div class="section-head" style="margin-bottom:0"><h1 style="font-size:clamp(38px,9vw,88px)">Ils nous<br>soutiennent</h1><span class="mono" id="p-compte" style="align-self:flex-end"></span></div>
  <p class="muted" id="p-chapo" style="max-width:78ch;margin-top:18px"></p>
</section>
<section class="section pad"><div id="p-listes"></div></section>
<section class="section dark pad" id="p-devenir" style="display:none">
  <div class="lines"></div>
  <div style="max-width:78ch">
    <h2 id="p-dev-titre" style="color:var(--creme);font-size:clamp(32px,5vw,52px)"></h2>
    <div id="p-dev-texte" style="margin-top:18px"></div>
    <a id="p-dev-bouton" class="btn btn-inverse" style="margin-top:26px;display:none"></a>
  </div>
</section>
</main>
<div id="footer"></div><script src="assets/site.js"></script>
<script>
window.__pageInit=async function(){
  const data=await getJSON("content/partenaires.json");
  const items=data?.items||[];

  document.getElementById("p-chapo").textContent=data?.chapo||"";
  document.getElementById("p-compte").textContent=items.length
    ? items.length+" partenaire"+(items.length>1?"s":"") : "";

  // Meme regle que les equipes : ORDRE ne fixe que l affichage des groupes
  // connus, un groupe inconnu mais non vide obtient quand meme sa section.
  const ORDRE=["Institutions","Entreprises"];
  const groupes=new Map(ORDRE.map(g=>[g,[]]));
  const autres=[];
  items.forEach(p=>{
    const g=typeof p.groupe==="string"?p.groupe.trim():"";
    if(!g){autres.push(p);return;}
    if(!groupes.has(g))groupes.set(g,[]);
    groupes.get(g).push(p);
  });
  if(groupes.has("Autres")||autres.length){
    const liste=[...(groupes.get("Autres")||[]),...autres];
    groupes.delete("Autres");
    groupes.set("Autres",liste);
  }

  const carte=p=>{
    // Une adresse refusee par lienSur() rend la carte non cliquable, exactement
    // comme une adresse absente : la mention « Voir le site » disparait avec le
    // lien, plutot que d annoncer un lien qui n existe pas.
    const site=lienSur(p.lien);
    const dedans=`<div class="logo-cadre">${p.logo
      ?`<img src="${echapper(p.logo)}" alt="${echapper(p.nom)}" loading="lazy">`
      :`<span class="mono" style="color:var(--mention)">[ logo à venir ]</span>`}</div>
      <div class="body" style="padding:16px 18px">
        <strong class="display-s" style="font-weight:900;text-transform:uppercase;line-height:1.05">${echapper(p.nom)}</strong>
        ${p.mot?`<span class="muted" style="font-size:13px;font-style:italic;border-left:3px solid var(--encre);padding-left:10px;line-height:1.5">« ${echapper(p.mot)} »</span>`:""}
        ${site?`<span class="mono lien" style="font-size:11px;letter-spacing:.12em">Voir le site ↗</span>`:""}
      </div>`;
    // Un partenaire sans adresse reste affiche, simplement pas cliquable :
    // une saisie incomplete degrade la carte, elle ne cree pas de lien mort.
    return site
      ?`<a class="card link shadow" href="${echapper(site)}" target="_blank" rel="noopener">${dedans}</a>`
      :`<div class="card shadow">${dedans}</div>`;
  };

  // La carte d appel ferme la DERNIERE grille affichee : la ou l oeil finit.
  // Elle reutilise le contenu du bloc « devenir » et ne parait que s il est
  // rempli ; le grand bloc sombre du bas de page reste tel quel.
  const d=data?.devenir;
  // Deux replis differents : rien de saisi garde le lien historique vers la page
  // Contact, une adresse refusee par lienSur() efface le bouton.
  const lienDevenir=lienSur(d?.lien);
  const lienCarte=d?.lien?lienDevenir:"contact.html";
  const carteAppel=d?.titre?`
    <div class="dark" style="border:2px solid var(--encre);display:flex;flex-direction:column;justify-content:center;gap:12px;padding:28px">
      <strong class="display-m" style="font-weight:900;text-transform:uppercase;line-height:1">${echapper(d.titre)}</strong>
      ${d.accroche?`<span style="font-size:13px;color:var(--texte-sombre);line-height:1.6">${echapper(d.accroche)}</span>`:""}
      ${d.bouton&&lienCarte?`<a href="${echapper(lienCarte)}" class="btn btn-inverse" style="align-self:flex-start;padding:9px 20px;font-size:16px">${echapper(d.bouton)}</a>`:""}
    </div>`:"";

  const visibles=[...groupes].filter(([,l])=>l.length);
  document.getElementById("p-listes").innerHTML=visibles.map(([nom,liste],i)=>`
    <div style="margin-bottom:56px">
      <div class="section-head" style="margin-bottom:20px"><h2>${echapper(nom)}</h2><span class="mono">${liste.length}</span></div>
      <div class="grille-partenaires">${liste.map(carte).join("")}${i===visibles.length-1?carteAppel:""}</div>
    </div>`).join("")||'<p class="vide muted">Les partenaires seront présentés prochainement.</p>';

  // Le bloc reste masque tant qu il n a pas de titre : meme convention que le
  // bloc « infos » des equipes, ou un titre vide masque tout.
  if(d?.titre){
    document.getElementById("p-devenir").style.display="";
    document.getElementById("p-dev-titre").textContent=d.titre;
    document.getElementById("p-dev-texte").innerHTML=mdToHtml(d.texte);
    if(d.bouton&&lienDevenir){
      const b=document.getElementById("p-dev-bouton");
      b.textContent=d.bouton;b.href=lienDevenir;b.style.display="";
    }
  }
};
</script></body></html>
