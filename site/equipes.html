<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Équipes — C.A. Brive Corrèze Volley</title>
<meta name="description" content="Des seniors à l'école de volley : toutes les équipes du CAB, créneaux et prochains matchs.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="C.A. Brive Corrèze Volley">
<meta property="og:title" content="Nos équipes — C.A. Brive Corrèze Volley">
<meta property="og:description" content="Des seniors à l'école de volley : toutes les équipes du CAB, créneaux et prochains matchs.">
<meta property="og:image" content="https://cabc-volley.nkobrs21.workers.dev/assets/partage.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="assets/style.css">
</head><body>
<div id="header"></div>
<main id="main">
<section class="pad section">
  <div class="crumb"><a href="index.html">Accueil</a><span>/</span><span style="color:var(--encre)">Équipes</span></div>
  <div class="section-head" style="margin-bottom:0"><h1 style="font-size:clamp(38px,9vw,88px)">Nos équipes</h1><span class="mono" style="align-self:flex-end">Saison 2026–2027 · 220 licencié·es</span></div>
  <nav class="ancres" id="ancres-groupes" aria-label="Groupes d'équipes"></nav>
</section>
<section class="section pad"><div id="teams-detail"></div></section>
</main>
<div id="footer"></div><script src="assets/site.js"></script>
<script>
window.__pageInit=async function(){
  const [teams,matches]=await Promise.all([getJSON("content/teams.json"),getJSON("content/matches.json")]);
  const items=teams?.items||[];
  const wrap=document.getElementById("teams-detail");

  // Prochain match de chaque equipe, pour donner envie de cliquer.
  const prochain={};
  (matches?.items||[]).filter(m=>m.equipe&&m.statut==="a_venir")
    .sort((a,b)=>new Date(a.date)-new Date(b.date))
    .forEach(m=>{if(!prochain[m.equipe])prochain[m.equipe]=m;});

  const carte=t=>{
    const m=prochain[t.slug];
    const inner=`<div class="ph" style="aspect-ratio:16/9;position:relative;overflow:hidden">${t.photo?`<img src="${t.photo}" alt="${t.nom}" loading="lazy" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">`:'<span class="mono" style="color:var(--mention)">[ photo à venir ]</span>'}</div>
      <div class="body"><strong class="display-m" style="font-weight:900;text-transform:uppercase;line-height:1.05">${t.nom}</strong>
      <span class="mono" style="font-size:11px;letter-spacing:.14em">${t.categorie||""}</span>
      ${t.creneau?`<span class="muted" style="font-size:13px">${t.creneau}</span>`:""}
      ${m?`<span class="mono" style="font-size:11px;letter-spacing:.12em;border-top:1px solid var(--lin);padding-top:8px;margin-top:4px">Prochain · ${fmtDate(m.date)} · ${m.adversaire}</span>`:""}</div>`;
    // Une equipe sans slug reste visible mais n est pas cliquable :
    // une saisie incomplete degrade la carte, elle ne cree pas de lien mort.
    return t.slug
      ?`<a class="card link shadow" href="${teamUrl(t.slug)}">${inner}</a>`
      :`<div class="card shadow">${inner}</div>`;
  };

  // ORDRE ne fixe que l'ordre d'affichage des groupes connus : ce n'est
  // plus une liste blanche, un groupe non vide absent de cette liste
  // obtient quand meme sa propre section.
  const ORDRE=["Séniors","Jeunes","Formation","Loisir"];
  const groupes=new Map(ORDRE.map(g=>[g,[]]));
  const autres=[];
  // Un groupe vide, absent ou fait uniquement d'espaces rejoint "Autres",
  // affiche en dernier ; un groupe non vide et inconnu cree sa propre
  // section, dans l'ordre de premiere apparition. Aucune equipe n'est
  // jamais perdue, quelle que soit la valeur de groupe.
  items.forEach(t=>{
    const nom=typeof t.groupe==="string"?t.groupe.trim():"";
    if(!nom){autres.push(t);return;}
    if(!groupes.has(nom))groupes.set(nom,[]);
    groupes.get(nom).push(t);
  });
  // "Autres" doit toujours arriver en dernier, meme si une equipe a pour
  // groupe le mot litteral "Autres" : on fusionne plutot que d'ecraser.
  if(groupes.has("Autres")||autres.length){
    const liste=[...(groupes.get("Autres")||[]),...autres];
    groupes.delete("Autres");
    groupes.set("Autres",liste);
  }

  // Ancre derivee du nom du groupe : accents retires, tout ce qui n est ni
  // lettre ni chiffre devient un tiret. Le prefixe « g- » sert aussi de cible a
  // la regle scroll-margin-top, l en-tete etant colle en haut.
  const slugAncre=s=>"g-"+s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-");
  const visibles=[...groupes].filter(([,l])=>l.length);
  wrap.innerHTML=visibles.map(([nom,liste])=>`
    <div style="margin-bottom:56px" id="${slugAncre(nom)}">
      <div class="section-head" style="margin-bottom:20px"><h2>${nom}</h2><span class="mono">${liste.length} équipe${liste.length>1?"s":""}</span></div>
      <div class="cols-3">${liste.map(carte).join("")}</div>
    </div>`).join("");
  // Un sommaire d un seul lien ne sert a rien : il ne parait qu a partir de deux
  // groupes.
  const ancres=document.getElementById("ancres-groupes");
  if(ancres&&visibles.length>1)ancres.innerHTML=visibles.map(([nom])=>`<a href="#${slugAncre(nom)}">${nom} ↓</a>`).join("");
};
</script></body></html>
