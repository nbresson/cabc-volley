<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Équipe — C.A. Brive Corrèze Volley</title>
<meta name="description" content="80 ans de volley au cœur de la Gaillarde. Équipes, calendrier, adhésion — rejoins la maison.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="C.A. Brive Corrèze Volley">
<meta property="og:title" content="Nos équipes — C.A. Brive Corrèze Volley">
<meta property="og:description" content="80 ans de volley au cœur de la Gaillarde. Équipes, calendrier, adhésion — rejoins la maison.">
<meta property="og:image" content="https://cabc-volley.nkobrs21.workers.dev/assets/partage.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="assets/style.css">
</head><body>
<div id="header"></div>
<main id="main">
<div id="equipe"></div>
</main>
<div id="footer"></div><script src="assets/site.js"></script>
<script>
window.__pageInit=async function(){
  const slug=new URLSearchParams(location.search).get("e");
  const [teams,matches,settings,gymnases]=await Promise.all([
    getJSON("content/teams.json"),getJSON("content/matches.json"),getJSON("content/settings.json"),
    getJSON("content/gymnases.json")]);
  const el=document.getElementById("equipe");
  const t=(teams?.items||[]).find(x=>x.slug&&x.slug===slug);
  if(!t){el.innerHTML='<section class="pad section"><p class="muted">Équipe introuvable. <a href="equipes.html" class="lien">Retour aux équipes</a></p></section>';return;}
  titrePage(t.nom);

  const entete=`<section class="pad section">
    <div class="crumb"><a href="index.html">Accueil</a><span>/</span><a href="equipes.html">Équipes</a><span>/</span><span style="color:var(--encre)">${echapper(t.nom)}</span></div>
    <div class="section-head" style="margin-bottom:0"><h1 style="font-size:clamp(32px,7vw,72px)">${echapper(t.nom)}</h1><span class="mono" style="align-self:flex-end">${echapper(t.categorie)}</span></div>
    ${phraseCreneaux(t,parSalle(gymnases)).map(c=>`<p class="mono" style="margin-top:12px;font-size:12px;letter-spacing:.14em;color:var(--taupe)">${echapper(c)}</p>`).join("")}
    ${t.photo
      ?`<img src="${echapper(t.photo)}" alt="${echapper(t.nom)}" style="display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border:2px solid var(--encre);margin-top:24px">`
      :'<div class="ph" style="aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;border:2px solid var(--encre);margin-top:24px"><span class="mono" style="color:var(--mention)">[ photo à venir ]</span></div>'}
  </section>`;

  const mine=(matches?.items||[]).filter(m=>m.equipe===t.slug);
  // Le premier match a venir passe dans le bandeau, les suivants dans la liste :
  // ici les deux se touchent, alors que l accueil les separe de trois sections.
  const tousAvenir=mine.filter(aVenir).sort((a,b)=>new Date(a.date)-new Date(b.date));
  const prochain=tousAvenir[0];
  const avenir=tousAvenir.slice(1,4);
  const finis=mine.filter(joue).sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,3);

  const blocAvenir=avenir.length?`<section class="section">
    <div class="pad"><h2 class="eyebrow" style="font-weight:400;line-height:1.65">— Prochains matchs</h2></div>
    <div class="match-list">${avenir.map(matchRow).join("")}</div></section>`:"";

  const blocResultats=finis.length?`<section class="section">
    <div class="pad"><h2 class="eyebrow" style="font-weight:400;line-height:1.65">— Derniers résultats</h2></div>
    <div class="match-list">${finis.map(ligneResultat).join("")}</div></section>`:"";

  // Le lien propre a l equipe prime. Le lien general des reglages ne sert de
  // repli que pour une equipe qui joue reellement des matchs : sans cela,
  // l ecole de volley afficherait un classement qui ne la concerne pas.
  // lienSur() ecarte une adresse saisie qui n est ni http(s), ni mailto, ni tel,
  // ni un chemin relatif : elle rend "", et le bloc entier disparait alors,
  // plutot que d offrir un bouton qui ne mene nulle part.
  const lienClassement=lienSur(t.classement||(mine.length?settings?.ffvb_classement:null));
  const blocClassement=lienClassement?`<section class="pad section">
    <a class="btn btn-secondary" href="${echapper(lienClassement)}" target="_blank" rel="noopener">Classement FFVB ↗</a></section>`:"";

  // Bloc des equipes sans calendrier : masque tant que le bureau n a pas
  // rempli au moins un titre dans Decap.
  const i=t.infos||{};
  // Meme regle que le classement : une adresse refusee par lienSur() efface le
  // bouton, elle ne le laisse pas pointer dans le vide.
  const lienInfos=lienSur(i.lien);
  const blocInfos=i.titre?`<section class="pad section">
    <div class="section-head" style="margin-bottom:14px"><h2>${echapper(i.titre)}</h2></div>
    ${i.texte?`<p class="muted" style="max-width:60ch;line-height:1.8">${echapper(i.texte)}</p>`:""}
    ${i.bouton&&lienInfos?`<a class="btn btn-primary" style="margin-top:20px" href="${echapper(lienInfos)}">${echapper(i.bouton)}</a>`:""}
  </section>`:"";

  // Un numero non numerique designe l encadrement : « E » pour l entraineur.
  // Ces cartes n ont pas de dossard a montrer, et passent en fin de grille —
  // l effectif se lit par les joueurs, le staff le referme.
  const estStaff=p=>p.num&&!/^\d+$/.test(String(p.num).trim());
  const eff=(t.effectif||[]).slice().sort((a,b)=>estStaff(a)-estStaff(b));
  const blocEffectif=eff.length?`<section class="pad section">
    <div class="section-head"><h2>L'effectif</h2><span class="mono">${eff.length} membre${eff.length>1?"s":""}</span></div>
    <div class="cols-4">${eff.map(p=>`
      <div class="card shadow"><div class="ph" style="aspect-ratio:3/4;position:relative;overflow:hidden">${p.photo?`<img src="${echapper(p.photo)}" alt="${echapper(p.nom)}" loading="lazy" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">`:'<span class="mono" style="color:var(--mention)">[ portrait ]</span>'}${estStaff(p)?"":`<strong class="display-xl" style="position:absolute;top:8px;right:14px;font-weight:900;text-shadow:0 0 6px var(--creme)">${echapper(p.num)}</strong>`}</div><div class="body"><strong class="display-s" style="font-weight:900;text-transform:uppercase;line-height:1">${echapper(p.nom)}</strong>${estStaff(p)?'<span class="badge badge-outline" style="align-self:flex-start">Staff</span>':""}<span class="mono" style="font-size:11px;letter-spacing:.14em">${echapper(p.poste)}</span></div></div>`).join("")}</div>
  </section>`:"";

  // Navigation entre fiches, dans l ordre editorial de teams.json. Les equipes
  // sans slug sont sautees : elles n ont pas de fiche ou aller. Aux extremites
  // le bouton n est pas rendu du tout, plutot que rendu inerte.
  const fiches=(teams?.items||[]).filter(x=>x.slug);
  const ici=fiches.findIndex(x=>x.slug===slug);
  const prec=ici>0?fiches[ici-1]:null;
  const suiv=ici>=0&&ici<fiches.length-1?fiches[ici+1]:null;
  const pied=`<section class="pad section" style="border-bottom:none">
    <div class="row" style="justify-content:space-between;padding-top:24px;border-top:2px solid var(--encre)">
      ${prec?`<a href="${teamUrl(prec.slug)}" class="btn btn-secondary">← ${echapper(prec.nom)}</a>`:""}
      <a href="equipes.html" class="btn btn-secondary">Toutes les équipes</a>
      ${suiv?`<a href="${teamUrl(suiv.slug)}" class="btn btn-secondary">${echapper(suiv.nom)} →</a>`:""}
      <a href="calendrier.html" class="btn btn-primary">Calendrier complet</a></div>
  </section>`;

  // Le bandeau se pose juste sous la photo d equipe, comme sur l accueil il
  // suit le heros. Absent si l equipe n a aucun match a venir — l ecole de
  // volley n en a jamais.
  const blocProchain=prochain?`<section class="section dark" style="padding:0">${bandeauProchainMatch(prochain)}</section>`:"";

  el.innerHTML=entete+blocProchain+blocInfos+blocAvenir+blocResultats+blocClassement+blocEffectif+pied;
  battreCompteARebours();
  const btnIcs=document.querySelector("[data-ics]");
  if(btnIcs)btnIcs.addEventListener("click",()=>telechargerICS([prochain],"cab-prochain-match.ics"));
};
</script></body></html>
