<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Article — C.A. Brive Corrèze Volley</title>
<meta name="description" content="80 ans de volley au cœur de la Gaillarde. Équipes, calendrier, adhésion — rejoins la maison.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="C.A. Brive Corrèze Volley">
<meta property="og:title" content="C.A. Brive Corrèze Volley — La fierté gaillarde — C.A. Brive Corrèze Volley">
<meta property="og:description" content="80 ans de volley au cœur de la Gaillarde. Équipes, calendrier, adhésion — rejoins la maison.">
<meta property="og:image" content="https://cabc-volley.nkobrs21.workers.dev/assets/partage.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="assets/style.css">
</head><body>
<div id="header"></div>
<main>
<article class="section" style="max-width:820px;margin:0 auto;padding:64px 48px" id="article"></article>
</main>
<div id="footer"></div><script src="assets/site.js"></script>
<script>
window.__pageInit=async function(){
  const slug=new URLSearchParams(location.search).get("slug");
  const data=await getJSON("content/news.json");
  const n=(data?.items||[]).find(x=>x.slug===slug)||(data?.items||[])[0];
  const el=document.getElementById("article");
  if(!n){el.innerHTML='<p class="muted">Article introuvable. <a href="actualites.html">Retour aux actualités</a></p>';return;}
  document.title=n.titre+" — C.A. Brive Corrèze Volley";
  // Deux autres actualites : d abord celles de la meme categorie, completees
  // par les plus recentes. Le bloc disparait si l article est le seul.
  const autres=[...(data?.items||[]).filter(x=>x.slug!==n.slug&&x.categorie===n.categorie),
                ...(data?.items||[]).filter(x=>x.slug!==n.slug&&x.categorie!==n.categorie)].slice(0,2);
  const lireAussi=autres.length?`
    <div class="display-l" style="font-weight:900;text-transform:uppercase;margin:40px 0 16px">À lire aussi</div>
    <div class="cols-2" style="gap:22px">${autres.map(x=>`
      <a class="card link" href="article.html?slug=${encodeURIComponent(x.slug||"")}" style="padding:18px 20px;gap:6px">
        <span class="mono" style="font-size:11px;letter-spacing:.18em">${fmtDate(x.date)} · ${x.categorie}</span>
        <strong class="display-s" style="font-weight:900;line-height:1;text-transform:uppercase">${x.titre}</strong>
      </a>`).join("")}</div>`:"";
  el.innerHTML=`
    <div class="crumb"><a href="actualites.html">Actualités</a><span>/</span><span style="color:var(--encre)">${n.categorie}</span></div>
    <h1 style="font-size:clamp(32px,7vw,56px);margin:14px 0">${n.titre}</h1>
    <div class="row" style="align-items:center;justify-content:space-between;margin-bottom:22px;padding-bottom:22px;border-bottom:2px solid var(--encre)">
      <span class="row" style="align-items:center"><span class="mono" style="font-size:11px;letter-spacing:.18em">${fmtDate(n.date)}</span><span class="badge">${n.categorie}</span></span>
      <button type="button" id="copier" class="chip">Copier le lien</button>
    </div>
    ${n.image?(n.cadrage==="entier"
      ?`<img src="${n.image}" alt="${n.titre}" style="display:block;max-width:100%;max-height:70vh;width:auto;margin:0 auto 28px;border:2px solid var(--encre)">`
      :`<img src="${n.image}" alt="${n.titre}" style="display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border:2px solid var(--encre);margin-bottom:28px">`)
      :'<div class="ph" style="aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;border:2px solid var(--encre);margin-bottom:28px"><span class="mono" style="color:var(--mention)">[ photo à venir ]</span></div>'}
    <p style="font-size:17px;line-height:1.75;font-weight:500;margin-bottom:20px">${n.extrait}</p>
    ${mdToHtml(n.corps)}
    ${lireAussi}
    <div class="row" style="justify-content:space-between;margin-top:40px;padding-top:24px;border-top:2px solid var(--encre)"><a href="actualites.html" class="btn btn-secondary">← Toutes les actus</a><a href="calendrier.html" class="btn btn-primary">Voir le prochain match</a></div>`;

  // navigator.clipboard n existe qu en contexte securise : en repli, le bouton
  // affiche l adresse, que le visiteur copie lui-meme.
  const cp=document.getElementById("copier");
  if(cp)cp.addEventListener("click",async()=>{
    try{await navigator.clipboard.writeText(location.href);cp.textContent="✓ Lien copié";}
    catch(e){cp.textContent=location.href;}
    setTimeout(()=>{cp.textContent="Copier le lien";},1800);
  });
};
</script></body></html>
