<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Le Club — C.A. Brive Corrèze Volley</title>
<link rel="icon" href="assets/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,900;1,900&family=DM+Mono:wght@400;500&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head><body>
<div id="header"></div>
<section class="hero section">
  <div class="lines"></div>
  <div class="eyebrow" id="hero-eyebrow"></div>
  <h1 id="hero-titre" style="max-width:14ch;margin:14px auto 0"></h1>
  <p class="muted" id="hero-chapo" style="max-width:58ch;margin:18px auto 0"></p>
</section>
<section class="section dark stats" id="chiffres"></section>
<section class="section split">
  <div class="pad">
    <div class="eyebrow" id="histoire-eyebrow"></div>
    <h2 id="histoire-titre" style="font-size:clamp(34px,5vw,52px);margin:14px 0"></h2>
    <div class="card" style="margin-top:8px" id="histoire-photo"></div>
  </div>
  <div id="histoire-dates"></div>
</section>
<section class="section pad">
  <div class="section-head"><h2 id="bureau-titre"></h2><span class="mono" id="bureau-mention"></span></div>
  <div id="bureau" class="cols-4"></div>
</section>
<section class="section pad">
  <div class="section-head"><h2>Nos infrastructures</h2><span class="mono" id="infra-sub"></span></div>
  <div id="infrastructures" class="cols-3"></div>
</section>
<section class="section pad">
  <div class="section-head"><h2 id="galerie-titre"></h2><span class="mono" id="galerie-legende"></span></div>
  <div class="cols-3" id="galerie"></div>
</section>
<div id="footer"></div><script src="assets/site.js"></script>
<script>
window.__pageInit=async function(){
  const [d,gym]=await Promise.all([getJSON("content/club.json"),getJSON("content/gymnases.json")]);
  // Rendu avant le retour anticipe : les infrastructures ne dependent pas de
  // club.json, un souci sur ce fichier ne doit pas les faire disparaitre.
  renderGymnases("infrastructures","infra-sub",gym);
  if(!d)return;
  const nl=s=>String(s||"").replace(/\n/g,"<br>");
  const gras=s=>String(s||"").replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");

  // Bandeau d'accueil
  const p=d.presentation||{};
  document.getElementById("hero-eyebrow").textContent=p.eyebrow||"";
  document.getElementById("hero-titre").innerHTML=nl(p.titre);
  document.getElementById("hero-chapo").textContent=p.chapo||"";

  // Chiffres clés
  const chiffres=p.chiffres||[];
  const bande=document.getElementById("chiffres");
  bande.style.setProperty("--n",chiffres.length||1);
  bande.innerHTML=chiffres.map(c=>`<div><strong>${c.valeur}</strong><span class="mono" style="font-size:11px;letter-spacing:.2em;color:var(--mention-sombre)">${c.libelle}</span></div>`).join("");

  // Histoire
  const h=d.histoire||{};
  document.getElementById("histoire-eyebrow").textContent=h.eyebrow||"";
  document.getElementById("histoire-titre").innerHTML=nl(h.titre);
  document.getElementById("histoire-photo").innerHTML=`
    <div class="ph" style="aspect-ratio:16/9;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden">${h.photo?vignette(h.photo,h.legende):'<span class="mono" style="letter-spacing:.1em;color:var(--mention)">[ photo d\'archive ]</span>'}</div>
    ${h.legende?`<div class="mono" style="padding:12px 18px;border-top:2px solid var(--encre)">${h.legende}</div>`:""}`;
  const dates=h.dates||[];
  document.getElementById("histoire-dates").innerHTML=dates.map((t,i)=>`
    <div class="pad timeline" style="padding-top:30px;padding-bottom:30px;${t.une?"background:var(--sable);":""}${i<dates.length-1?"border-bottom:1px solid var(--lin)":""}">
      <strong class="display-2xl" style="font-weight:900;line-height:1">${t.annee}</strong>
      <p class="muted" style="align-self:center;font-size:14px">${gras(t.texte)}</p>
    </div>`).join("");

  // Le bureau
  const b=d.bureau||{},a=b.appel||{};
  document.getElementById("bureau-titre").textContent=b.titre||"Le bureau";
  document.getElementById("bureau-mention").textContent=b.mention||"";
  const membres=(b.membres||[]).map(m=>`
    <div class="card shadow">
      <div class="ph" style="aspect-ratio:3/4;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden">${m.photo?vignette(m.photo,m.nom):'<span class="mono" style="color:var(--mention)">[ portrait ]</span>'}</div>
      <div class="body"><strong class="display-m" style="font-weight:900;text-transform:uppercase;line-height:1">${m.nom}</strong><span class="mono" style="font-size:11px;letter-spacing:.16em">${m.role||""}</span></div>
    </div>`);
  if(a.titre)membres.push(`
    <div class="dark" style="border:2px solid var(--encre);display:flex;flex-direction:column;justify-content:center;gap:12px;padding:28px">
      <strong class="display-m" style="font-weight:900;text-transform:uppercase;line-height:1">${a.titre}</strong>
      <span style="font-size:13px;color:var(--texte-sombre)">${a.texte||""}</span>
      ${a.bouton?`<a href="${a.lien||"contact.html"}" class="btn btn-outline-light" style="align-self:flex-start;padding:9px 20px;font-size:16px">${a.bouton}</a>`:""}
    </div>`);
  document.getElementById("bureau").innerHTML=membres.join("");

  // La vie du club
  const g=d.galerie||{};
  document.getElementById("galerie-titre").textContent=g.titre||"";
  document.getElementById("galerie-legende").textContent=g.legende||"";
  const photos=(g.photos||[]).filter(Boolean);
  document.getElementById("galerie").innerHTML=photos.map(src=>`
    <div class="ph" style="aspect-ratio:16/9;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden">${vignette(src,"")}</div>`).join("")
    ||'<p class="muted">Les photos de la saison arrivent bientôt.</p>';
};
</script></body></html>
