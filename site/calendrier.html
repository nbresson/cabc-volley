<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calendrier & résultats — C.A. Brive Corrèze Volley</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="assets/style.css">
</head><body>
<div id="header"></div>
<main>
<section class="pad section">
  <div class="crumb"><a href="index.html">Accueil</a><span>/</span><span style="color:var(--encre)">Calendrier &amp; résultats</span></div>
  <h1 style="font-size:clamp(38px,9vw,88px)">Calendrier<br>&amp; résultats</h1>
</section>
<section class="section dark" id="last-result" style="padding:0"></section>
<section class="section split" style="--b:1.5fr">
  <div class="pad">
    <div class="eyebrow">— Prochaines journées</div>
    <h2 style="font-size:clamp(32px,5vw,52px);margin:14px 0 18px">Les matchs<br>à venir</h2>
    <p class="muted" style="max-width:38ch">Entrée libre pour tous les matchs à domicile. La buvette ouvre une heure avant le coup d'envoi.</p>
    <div class="chips" id="chips-equipes" style="margin-top:20px"></div>
    <a id="ffvb1" class="btn btn-secondary" style="margin-top:20px" target="_blank" rel="noopener">Calendrier complet FFVB ↗</a>
  </div>
  <div id="upcoming" class="match-list"></div>
</section>
<section class="section pad">
  <div class="section-head"><h2 id="cl-titre">Classement</h2><a id="ffvb2" class="mono lien" style="color:var(--encre)" target="_blank" rel="noopener">Classement FFVB officiel →</a></div>
  <div class="position-band" id="cl-position" style="display:none"></div>
  <div class="table-wrap" id="cl-tableau"><table class="ds"><thead><tr><th>#</th><th>Équipe</th><th style="text-align:center">J</th><th style="text-align:center">V</th><th style="text-align:center">D</th><th style="text-align:right">Pts</th></tr></thead>
  <tbody id="cl-lignes"></tbody></table></div>
  <p class="vide muted" id="cl-vide" style="display:none">Classement à venir.</p>
  <p class="mono" id="cl-note" style="margin-top:14px;font-size:11px"></p>
</section>
</main>
<div id="footer"></div><script src="assets/site.js"></script>
<script>
window.__pageInit=async function(){
  const [matches,settings,classement,teams]=await Promise.all([getJSON("content/matches.json"),getJSON("content/settings.json"),getJSON("content/classement.json"),getJSON("content/teams.json")]);
  if(settings?.ffvb_classement){document.getElementById("ffvb1").href=settings.ffvb_classement;document.getElementById("ffvb2").href=settings.ffvb_classement;}
  // Le rang n est pas stocke : c est la position dans la liste. Reordonner les
  // lignes dans Decap suffit, aucun numero n est a saisir.
  const cl=classement||{};
  document.getElementById("cl-titre").textContent=cl.titre||"Classement";
  const lignes=Array.isArray(cl.items)?cl.items:[];
  // Un chiffre absent ou illisible vaut 0 : la ligne reste lisible plutot que trouee.
  const n=v=>Number.isFinite(+v)?+v:0;
  if(lignes.length){
    document.getElementById("cl-lignes").innerHTML=lignes.map((e,i)=>`
      <tr${e.notre_club?' class="hl"':''}><td>${i+1}</td><td>${e.equipe||""}</td><td style="text-align:center">${n(e.joues)}</td><td style="text-align:center">${n(e.victoires)}</td><td style="text-align:center">${n(e.defaites)}</td><td style="text-align:right"><strong class="display-s">${n(e.points)}</strong></td></tr>`).join("");
    document.getElementById("cl-vide").remove();
    // Le bandeau ne parait que si une ligne porte « notre club » : sans lui,
    // aucune position a annoncer.
    const iNous=lignes.findIndex(e=>e.notre_club);
    if(iNous>-1){
      const nous=lignes[iNous],pos=document.getElementById("cl-position");
      pos.innerHTML=`<div><strong>${iNous+1}<span style="font-size:.5em">e</span></strong><span>NOTRE POSITION</span></div>
        <div><strong>${n(nous.points)}</strong><span>POINTS</span></div>
        <div><strong>${n(nous.victoires)} – ${n(nous.defaites)}</strong><span>VICTOIRES – DÉFAITES</span></div>`;
      pos.style.display="";
    }
  }else{
    // Sans lignes, le tableau disparait mais la section reste : son titre et le
    // lien vers le classement officiel FFVB gardent leur utilite.
    document.getElementById("cl-tableau").remove();
    document.getElementById("cl-vide").style.display="";
  }
  const note=document.getElementById("cl-note");
  if(cl.note)note.textContent=cl.note; else note.remove();
  const last=(matches?.items||[]).filter(m=>m.statut==="termine").sort((a,b)=>new Date(b.date)-new Date(a.date))[0];
  const lr=document.getElementById("last-result");
  if(last&&lr){const d=new Date(last.date);const home=last.domicile;const a=home?"C.A. Brive":last.adversaire,b=home?last.adversaire:"C.A. Brive";
    // Le bandeau est passe sur fond sombre : les gris et la bordure du score
    // suivent, sinon ils disparaissent dans l encre. Le badge n apparait que si
    // le champ « gagne » a ete renseigne — sans lui, le score parle seul.
    const cabGagne=last.gagne;
    lr.innerHTML=`<div class="pad"><div class="eyebrow" style="color:var(--mention-sombre);margin-bottom:14px">Dernier match · ${last.competition} · ${d.toLocaleDateString("fr-FR",{weekday:"short",day:"2-digit",month:"short"})}</div>
      <div class="match-band" style="padding:0">
        <strong style="font-family:'Barlow Condensed';font-weight:${home?900:700};font-size:clamp(24px,4vw,36px);${home?'':'color:var(--mention-sombre)'}">${a}</strong>
        <span class="row" style="align-items:center;justify-content:center;gap:18px">
          <span class="score" style="border-color:var(--creme)">${last.score||"–"}</span>
          ${cabGagne!==undefined?`<span class="badge" style="background:var(--creme);color:var(--encre)">${cabGagne?"Victoire":"Défaite"}</span>`:""}
        </span>
        <strong style="font-family:'Barlow Condensed';font-weight:${home?700:900};font-size:clamp(24px,4vw,36px);${home?'color:var(--mention-sombre)':''}">${b}</strong>
      </div></div>`;}
  // Tri chronologique : l ordre de saisie dans Decap ne garantit rien, et les
  // premiers matchs affiches doivent bien etre les prochains joues.
  const avenir=(matches?.items||[]).filter(m=>m.statut==="a_venir").sort((a,b)=>new Date(a.date)-new Date(b.date));
  const VISIBLES=5;
  const reste=avenir.slice(VISIBLES);
  // On n ouvre jamais un tiroir pour un seul match : en dessous de deux matchs
  // restants, la liste s affiche entiere plutot que d imposer un clic pour rien.
  const replie=reste.length>=2;
  const up=document.getElementById("upcoming");
  if(!avenir.length){up.innerHTML='<p class="vide muted pad">Aucun match programmé pour le moment.</p>';}
  else{
    up.innerHTML=(replie?avenir.slice(0,VISIBLES):avenir).map(matchRow).join("")
      +(replie?`<details class="acc"><summary>Voir les ${reste.length} autres matchs de la saison</summary><div class="acc-body" style="padding:0">${reste.map(matchRow).join("")}</div></details>`:"");
  }
  // Chips par equipe, seulement si plusieurs equipes ont des matchs a venir :
  // un unique bouton « Toutes » ne filtrerait rien.
  const nomEquipe=s=>(teams?.items||[]).find(t=>t.slug===s)?.nom||s;
  const slugs=[...new Set(avenir.map(m=>m.equipe).filter(Boolean))];
  const chips=document.getElementById("chips-equipes");
  if(chips&&slugs.length>1){
    chips.innerHTML=`<button class="chip actif" data-valeur="tout">Toutes</button>`+
      slugs.map(s=>`<button class="chip" data-valeur="${s}">${nomEquipe(s)}</button>`).join("");
    initChips("chips-equipes","upcoming");
  }
};
</script></body></html>
