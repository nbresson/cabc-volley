<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calendrier & résultats — C.A. Brive Corrèze Volley</title>
<meta name="description" content="Matchs à venir, derniers résultats et classement. Entrée libre à domicile.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="C.A. Brive Corrèze Volley">
<meta property="og:title" content="Calendrier &amp; résultats — C.A. Brive Corrèze Volley">
<meta property="og:description" content="Matchs à venir, derniers résultats et classement. Entrée libre à domicile.">
<meta property="og:image" content="https://cabc-volley.nkobrs21.workers.dev/assets/partage.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="assets/style.css">
</head><body>
<div id="header"></div>
<main id="main">
<section class="pad section">
  <div class="crumb"><a href="index.html">Accueil</a><span>/</span><span style="color:var(--encre)">Calendrier &amp; résultats</span></div>
  <h1 style="font-size:clamp(38px,9vw,88px)">Calendrier<br>&amp; résultats</h1>
</section>
<section class="section dark" id="last-result" style="padding:0"></section>
<section class="section" id="resultats" style="display:none">
  <div class="pad"><h2 class="eyebrow" style="font-weight:400;line-height:1.65">— Derniers résultats</h2></div>
  <div class="match-list" id="resultats-liste"></div>
</section>
<section class="section split" style="--b:1.5fr">
  <div class="pad">
    <div class="eyebrow">— Prochaines journées</div>
    <h2 style="font-size:clamp(32px,5vw,52px);margin:14px 0 18px">Les matchs<br>à venir</h2>
    <p class="muted" style="max-width:38ch">Entrée libre pour tous les matchs à domicile. La buvette ouvre une heure avant le coup d'envoi.</p>
    <div id="filtres" style="margin-top:20px;display:flex;flex-direction:column;gap:12px">
      <div id="filtre-equipes" style="display:none">
        <span class="mono" style="font-size:10px;letter-spacing:.2em;display:block;margin-bottom:7px">Équipe</span>
        <div class="chips" id="chips-equipes"></div>
      </div>
      <div id="filtre-lieux" style="display:none">
        <span class="mono" style="font-size:10px;letter-spacing:.2em;display:block;margin-bottom:7px">Lieu</span>
        <div class="chips" id="chips-lieux"></div>
      </div>
    </div>
    <a id="ffvb1" class="btn btn-secondary" style="margin-top:20px" target="_blank" rel="noopener">Calendrier complet FFVB ↗</a>
    <button type="button" id="ics-saison" class="btn btn-secondary" style="margin-top:12px;display:none">↓ Toute la saison dans mon agenda</button>
  </div>
  <div id="upcoming" class="match-list"></div>
</section>
<section class="section pad">
  <div class="section-head" id="classement"><h2 id="cl-titre">Classement</h2><a id="ffvb2" class="mono lien" style="color:var(--encre)" target="_blank" rel="noopener">Classement FFVB officiel →</a></div>
  <div class="chips" id="chips-classements" style="margin-bottom:26px"></div>
  <div id="cl-blocs"></div>
</section>
</main>
<div id="footer"></div><script src="assets/site.js"></script>
<script>
window.__pageInit=async function(){
  const [matches,settings,classement,teams,gymnases]=await Promise.all([getJSON("content/matches.json"),getJSON("content/settings.json"),getJSON("content/classement.json"),getJSON("content/teams.json"),getJSON("content/gymnases.json")]);

  // Les rencontres a venir, en donnees structurees. Celles qui sont jouees en
  // sont exclues : aVenir() est deja l arbitre de cette distinction partout
  // ailleurs sur le site, et une rencontre passee n interesse aucun moteur.
  // Un seul bloc portant un tableau, et non un bloc par match : JSON-LD
  // l accepte, et une saison entiere ferait sinon cinquante balises.
  const rencontres=(matches?.items||[]).filter(aVenir)
    .map(m=>matchJsonLd(m,teams?.items||[],gymnases));
  if(rencontres.length)poserJsonLd(rencontres);
  // Les deux boutons FFVB de la page portent l adresse des reglages. lienSur()
  // ecarte une adresse hostile : le bouton reste alors sans href, exactement comme
  // lorsque le reglage n est pas rempli.
  const ffvbGeneral=lienSur(settings?.ffvb_classement);
  if(ffvbGeneral){document.getElementById("ffvb1").href=ffvbGeneral;document.getElementById("ffvb2").href=ffvbGeneral;}
  // Un tableau par poule. Le rang n est pas stocke : c est la position dans la
  // liste. Reordonner les lignes dans Decap suffit, aucun numero n est a saisir.
  const tableaux=(classement?.items||[]).filter(c=>c&&c.equipe);
  const equipe=s=>(teams?.items||[]).find(t=>t.slug===s)||{};
  // Un chiffre absent ou illisible vaut 0 : la ligne reste lisible plutot que trouee.
  const n=v=>Number.isFinite(+v)?+v:0;
  // Chaque bloc porte son data-filtre : les puces n en montrent qu un a la fois,
  // et le bandeau « notre position » ne parle que du tableau sous les yeux.
  const bloc=c=>{
    const lignes=Array.isArray(c.lignes)?c.lignes:[];
    if(!lignes.length)return `<div data-filtre="${echapper(c.equipe)}"><p class="vide muted">Classement à venir.</p></div>`;
    // Le bandeau ne parait que si une ligne porte « notre club » : sans lui,
    // aucune position a annoncer.
    const iNous=lignes.findIndex(l=>l.notre_club);
    const band=iNous<0?"":`<div class="position-band">
      <div><strong>${iNous+1}<span style="font-size:.5em">e</span></strong><span>NOTRE POSITION</span></div>
      <div><strong>${n(lignes[iNous].points)}</strong><span>POINTS</span></div>
      <div><strong>${n(lignes[iNous].victoires)} – ${n(lignes[iNous].defaites)}</strong><span>VICTOIRES – DÉFAITES</span></div></div>`;
    return `<div data-filtre="${echapper(c.equipe)}">${band}
      <div class="table-wrap"><table class="ds"><thead><tr><th>#</th><th>Club</th><th style="text-align:center">J</th><th style="text-align:center">V</th><th style="text-align:center">D</th><th style="text-align:right">Pts</th></tr></thead><tbody>
      ${lignes.map((l,i)=>`<tr${l.notre_club?' class="hl"':''}><td>${i+1}</td><td>${echapper(l.club)}</td><td style="text-align:center">${n(l.joues)}</td><td style="text-align:center">${n(l.victoires)}</td><td style="text-align:center">${n(l.defaites)}</td><td style="text-align:right"><strong class="display-s">${n(l.points)}</strong></td></tr>`).join("")}
      </tbody></table></div>
      ${c.note?`<p class="mono" style="margin-top:14px;font-size:11px">${echapper(c.note)}</p>`:""}</div>`;
  };
  document.getElementById("cl-blocs").innerHTML=tableaux.map(bloc).join("");
  // Le titre et le lien FFVB vivent dans l en-tete de section et suivent la puce :
  // chaque equipe a sa poule, donc son propre classement officiel.
  const montrer=slug=>{
    const c=tableaux.find(t=>t.equipe===slug)||{};
    document.getElementById("cl-titre").textContent=c.titre||"Classement";
    // Meme regle que la fiche d equipe : une adresse refusee efface le lien plutot
    // que de le laisser pointer dans le vide.
    const a=document.getElementById("ffvb2"),lien=lienSur(equipe(slug).classement||settings?.ffvb_classement);
    if(lien){a.href=lien;a.style.display="";}else a.style.display="none";
    document.querySelectorAll("#cl-blocs [data-filtre]").forEach(el=>{el.style.display=el.dataset.filtre===slug?"":"none";});
  };
  if(tableaux.length){
    const defaut=(tableaux.find(c=>c.une)||tableaux[0]).equipe;
    // Une seule poule : la puce n aurait rien a offrir, le tableau parle seul.
    if(tableaux.length>1){
      const puces=document.getElementById("chips-classements");
      puces.innerHTML=tableaux.map(c=>`<button type="button" class="chip${c.equipe===defaut?" actif":""}" data-valeur="${echapper(c.equipe)}">${echapper(equipe(c.equipe).nom||c.equipe)}</button>`).join("");
      puces.addEventListener("click",e=>{
        const b=e.target.closest(".chip");if(!b)return;
        puces.querySelectorAll(".chip").forEach(c=>c.classList.remove("actif"));
        b.classList.add("actif");montrer(b.dataset.valeur);
      });
    }
    montrer(defaut);
  }
  const last=(matches?.items||[]).filter(joue).sort((a,b)=>new Date(b.date)-new Date(a.date))[0];
  const lr=document.getElementById("last-result");
  if(last&&lr){const d=new Date(last.date);const home=last.domicile;const a=home?"C.A. Brive":last.adversaire,b=home?last.adversaire:"C.A. Brive";
    // Le bandeau est passe sur fond sombre : les gris et la bordure du score
    // suivent, sinon ils disparaissent dans l encre. Le badge dit « en attente »
    // tant que le score n est pas saisi — voir resultatConnu() dans site.js.
    const cabGagne=last.gagne;
    lr.innerHTML=`<div class="pad"><div class="eyebrow" style="color:var(--mention-sombre);margin-bottom:14px">Dernier match · ${echapper(last.competition)} · ${d.toLocaleDateString("fr-FR",{weekday:"short",day:"2-digit",month:"short"})}</div>
      <div class="match-band" style="padding:0">
        <strong style="font-family:'Barlow Condensed';font-weight:${home?900:700};font-size:clamp(24px,4vw,36px);${home?'':'color:var(--mention-sombre)'}">${echapper(a)}</strong>
        <span class="row" style="align-items:center;justify-content:center;gap:18px">
          <span class="score" style="border-color:var(--creme)">${echapper(last.score)||"–"}</span>
          ${resultatConnu(last)?`<span class="badge" style="background:var(--creme);color:var(--encre)">${cabGagne?"Victoire":"Défaite"}</span>`:`<span class="badge" style="background:transparent;border:1px solid var(--mention-sombre);color:var(--mention-sombre);padding:4px 12px">En attente de résultat</span>`}
        </span>
        <strong style="font-family:'Barlow Condensed';font-weight:${home?700:900};font-size:clamp(24px,4vw,36px);${home?'color:var(--mention-sombre)':''}">${echapper(b)}</strong>
      </div></div>`;}
  // Tri chronologique : l ordre de saisie dans Decap ne garantit rien, et les
  // premiers matchs affiches doivent bien etre les prochains joues.
  const avenir=(matches?.items||[]).filter(aVenir).sort((a,b)=>new Date(a.date)-new Date(b.date));
  const VISIBLES=5;
  const up=document.getElementById("upcoming");
  const bIcs=document.getElementById("ics-saison");
  // Le decoupage « cinq visibles puis le reste » se calculait une fois pour
  // toutes sur la liste entiere, quand le filtre par equipe ne faisait que
  // masquer des lignes en CSS : l accordeon annoncait quarante-huit matchs
  // quand il en contenait dix-neuf, et deux lignes paraissaient au lieu de
  // cinq. Tout ce qui se compte doit donc se recompter a chaque puce — le
  // nombre juste vient de la reconstruction, pas d une arithmetique tenue a
  // cote qui derive au premier changement.
  // Un seul etat pour les deux filtres, une seule reconstruction. Deux
  // filtres doublent les occasions du defaut corrige plus haut : un compte
  // tenu a cote d une liste qu on masque derive au premier changement.
  const etat={equipe:"tout",lieu:"tout"};
  const retenu=m=>
    (etat.equipe==="tout"||m.equipe===etat.equipe)&&
    (etat.lieu==="tout"||(etat.lieu==="domicile")===!!m.domicile);
  const poserAvenir=()=>{
    const liste=avenir.filter(retenu);
    if(!liste.length){
      // Avec deux filtres, l intersection vide devient un cas ordinaire — une
      // equipe a qui il ne reste que des deplacements en fin de saison. Dire
      // « aucun match programme » serait alors faux : il y en a, mais pas
      // ceux-la. Le message distingue les deux, et offre la sortie.
      const filtre=etat.equipe!=="tout"||etat.lieu!=="tout";
      up.innerHTML=filtre
        ?`<p class="vide muted pad">Aucun match ne correspond à ce filtre. <button type="button" class="lien" id="tout-voir" style="background:none;border:none;padding:0;font:inherit;cursor:pointer;color:inherit">Voir tous les matchs</button></p>`
        :'<p class="vide muted pad">Aucun match programmé pour le moment.</p>';
      const b=document.getElementById("tout-voir");
      if(b)b.onclick=()=>{etat.equipe="tout";etat.lieu="tout";
        document.querySelectorAll("#filtres .chip").forEach(c=>
          c.classList.toggle("actif",c.dataset.valeur==="tout"));
        poserAvenir();};
      bIcs.style.display="none";
      return;
    }
    const reste=liste.slice(VISIBLES);
    // On n ouvre jamais un tiroir pour un seul match : en dessous de deux matchs
    // restants, la liste s affiche entiere plutot que d imposer un clic pour rien.
    // La regle s applique a ce que le visiteur regarde, donc a la liste filtree :
    // en fin de saison, une equipe a qui il ne reste que deux matchs verrait
    // sinon un tiroir s ouvrir sur du vide.
    const replie=reste.length>=2;
    up.innerHTML=(replie?liste.slice(0,VISIBLES):liste).map(matchRow).join("")
      +(replie?`<details class="acc"><summary>Voir les ${reste.length} autres matchs${etat.equipe==="tout"&&etat.lieu==="tout"?" de la saison":""}</summary><div class="acc-body" style="padding:0">${reste.map(matchRow).join("")}</div></details>`:"");
    // onclick et non addEventListener : le bloc est reconstruit a chaque puce,
    // et des ecouteurs empiles telechargeraient autant de fichiers que de clics.
    bIcs.style.display="";
    const filtre=etat.equipe!=="tout"||etat.lieu!=="tout";
    bIcs.textContent=filtre?`↓ Les ${liste.length} matchs dans mon agenda`:"↓ Toute la saison dans mon agenda";
    // Le fichier suit les deux filtres, contenu ET nom : telecharger apres
    // avoir choisi « exterieur » doit donner les seuls deplacements, et le
    // nom doit le dire — sans quoi trois fichiers homonymes se ressemblent.
    const bout=[etat.equipe!=="tout"?etat.equipe:"",etat.lieu!=="tout"?etat.lieu:""].filter(Boolean).join("-");
    bIcs.onclick=()=>telechargerICS(liste,`cab-${bout||"saison"}-${saisonSportive("-")}.ics`);
  };
  poserAvenir();

  // Derniers resultats. Le tout premier est deja dans le bandeau sombre : la
  // liste montre les trois suivants, et disparait s il n y en a pas.
  const finis=(matches?.items||[]).filter(joue).sort((a,b)=>new Date(b.date)-new Date(a.date));
  const suivants=finis.slice(1,4);
  if(suivants.length){
    document.getElementById("resultats-liste").innerHTML=suivants.map(ligneResultat).join("");
    document.getElementById("resultats").style.display="";
  }

  // Chips par equipe, seulement si plusieurs equipes ont des matchs a venir :
  // un unique bouton « Toutes » ne filtrerait rien.
  const nomEquipe=s=>(teams?.items||[]).find(t=>t.slug===s)?.nom||s;
  const slugs=[...new Set(avenir.map(m=>m.equipe).filter(Boolean))];
  const chips=document.getElementById("chips-equipes");
  if(chips&&slugs.length>1){
    document.getElementById("filtre-equipes").style.display="";
    chips.innerHTML=`<button class="chip actif" data-valeur="tout">Toutes</button>`+
      slugs.map(s=>`<button class="chip" data-valeur="${echapper(s)}">${echapper(nomEquipe(s))}</button>`).join("");
    // Filtre propre a cette page : le filtre partage masque des lignes en CSS,
    // ce qui ne peut pas recompter un accordeon. La page Actualites, elle,
    // continue de l employer — sans pagination, il n y a rien a recompter.
    chips.addEventListener("click",e=>{
      const b=e.target.closest(".chip");if(!b)return;
      chips.querySelectorAll(".chip").forEach(c=>c.classList.remove("actif"));
      b.classList.add("actif");
      etat.equipe=b.dataset.valeur;
      poserAvenir();
    });
  }

  // Les puces de lieu ne paraissent que si les deux cas existent : comme pour
  // les equipes, un filtre qui ne retire rien n a pas lieu d etre.
  const lieux=document.getElementById("chips-lieux");
  const aDomicile=avenir.some(m=>m.domicile),aExterieur=avenir.some(m=>!m.domicile);
  if(lieux&&aDomicile&&aExterieur){
    document.getElementById("filtre-lieux").style.display="";
    lieux.innerHTML=`<button class="chip actif" data-valeur="tout">Tous</button>`+
      `<button class="chip" data-valeur="domicile">Domicile</button>`+
      `<button class="chip" data-valeur="exterieur">Extérieur</button>`;
    lieux.addEventListener("click",e=>{
      const b=e.target.closest(".chip");if(!b)return;
      lieux.querySelectorAll(".chip").forEach(c=>c.classList.remove("actif"));
      b.classList.add("actif");
      etat.lieu=b.dataset.valeur;
      poserAvenir();
    });
  }
};
</script></body></html>
