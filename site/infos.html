<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Infos &amp; documents — C.A. Brive Corrèze Volley</title>
<meta name="description" content="Licences, certificats médicaux, règles officielles : les documents utiles du club.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="C.A. Brive Corrèze Volley">
<meta property="og:title" content="Infos &amp; documents — C.A. Brive Corrèze Volley">
<meta property="og:description" content="Licences, certificats médicaux, règles officielles : les documents utiles du club.">
<meta property="og:image" content="https://cabc-volley.nkobrs21.workers.dev/assets/partage.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="assets/style.css">
</head><body>
<div id="header"></div>
<main id="main">
<section class="pad section">
  <div class="crumb"><a href="index.html">Accueil</a><span>/</span><span style="color:var(--encre)">Infos &amp; documents</span></div>
  <div class="section-head" style="margin-bottom:0"><h1 style="font-size:clamp(38px,9vw,88px)" id="titre"></h1><span class="mono" id="compteur" style="align-self:flex-end"></span></div>
  <p class="muted" id="chapo" style="max-width:60ch;margin-top:14px"></p>
  <nav class="ancres" id="ancres-blocs" aria-label="Sections" style="display:none"></nav>
</section>
<section class="section dark" id="essentiel" style="padding:0;display:none">
  <div class="pad" style="padding-bottom:24px">
    <div class="eyebrow" style="color:var(--mention-sombre)">L'essentiel pour ta licence</div>
    <h2 id="essentiel-titre" style="color:var(--creme);font-size:clamp(26px,4vw,34px);margin-top:8px"></h2>
  </div>
  <div class="essentiel-grille" id="essentiel-cas"></div>
</section>
<div id="blocs"></div>
</main>
<div id="footer"></div><script src="assets/site.js"></script>
<script>
window.__pageInit=async function(){
  const data=await getJSON("content/infos.json");
  const titre=data?.titre||"Infos & documents";
  document.title=titre+" — C.A. Brive Corrèze Volley";
  document.getElementById("titre").textContent=titre;
  const chapo=document.getElementById("chapo");
  if(data?.chapo)chapo.textContent=data.chapo; else chapo.remove();

  // Une adresse saisie sans protocole serait resolue relativement au site et
  // menerait a la page 404. Ce champ est neuf, la faute est probable. On laisse
  // passer tel quel un schema explicite (https:, mailto:, tel:...) ou un chemin
  // racine (/adhesion.html) : seul un nom d hote nu doit recevoir le prefixe.
  const externe=u=>/^([a-z][a-z0-9+.-]*:|\/)/i.test(u)?u:"https://"+u;

  // L extension du fichier televerse determine le suffixe affiche : on ne
  // suppose jamais "(PDF)", le widget accepte n importe quel type de fichier.
  const extension=nom=>{
    const m=/\.([a-z0-9]+)$/i.exec(nom||"");
    return m?m[1].toUpperCase():"";
  };

  // Domaine d une adresse, pour la ligne de source (« extranet.ffvb.org »).
  const domaine=u=>{try{return new URL(externe(u),location.href).hostname.replace(/^www\./,"");}catch(e){return"";}};

  // Rangee de document. Un intertitre n est pas numerote et ne compte pas ; un
  // fichier televerse porte une fleche descendante, un lien externe une fleche
  // oblique. Un document dont le champ utile est vide est ignore, le reste du
  // bloc s affichant quand meme.
  const rangee=(d,num)=>{
    if(d.type==="intertitre")return `<div class="doc-inter"><span></span><span>${d.libelle||""}</span></div>`;
    const fichier=d.type==="fichier"&&d.fichier;
    const url=fichier?d.fichier:(d.url?externe(d.url):"");
    if(!url)return"";
    const ext=extension(fichier?d.fichier:d.url)||"LIEN";
    const type=[ext,d.langue].filter(Boolean).join(" · ");
    return `<a class="doc-row" href="${url}"${fichier?' download':' target="_blank" rel="noopener"'}>
      <span class="num">${String(num).padStart(2,"0")}</span>
      <span><span class="titre">${d.libelle||"Document"}</span><span class="source">${fichier?"document du club":domaine(d.url)}</span></span>
      <span class="type"${d.langue==="EN"?' style="background:var(--sable);color:var(--encre)"':""}>${type}</span>
      <span class="fleche">${fichier?"↓":"↗"}</span></a>`;
  };

  const slugAncre=s=>"b-"+String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-");
  const blocs=data?.blocs||[];
  let total=0;
  document.getElementById("blocs").innerHTML=blocs.length?blocs.map(b=>{
    const docs=b.documents||[];
    const reels=docs.filter(d=>d.type!=="intertitre");
    total+=reels.length;
    let n=0;
    const lignes=docs.map(d=>rangee(d,d.type==="intertitre"?0:++n)).join("");
    return `<section class="pad section" id="${slugAncre(b.titre)}">
      <div class="section-head"><h2>${b.titre||""}</h2><span class="mono">${reels.length} document${reels.length>1?"s":""}</span></div>
      ${b.texte?mdToHtml(b.texte):""}
      ${lignes?`<div class="doc-liste">${lignes}</div>`:""}
    </section>`;
  }).join(""):'<section class="pad section"><p class="vide muted">Aucune information pour le moment.</p></section>';

  document.getElementById("compteur").textContent=total?total+" documents · saison 2026–2027":"";
  // Un sommaire d un seul lien ne sert a rien.
  const ancres=document.getElementById("ancres-blocs");
  if(blocs.length>1){
    ancres.innerHTML=blocs.map(b=>`<a href="#${slugAncre(b.titre)}">${b.titre} ↓</a>`).join("");
    ancres.style.display="";
  }

  // Bloc « L essentiel » : masque sans contenu, comme le bloc infos des equipes.
  const e=data?.essentiel;
  if(e?.cas?.length){
    document.getElementById("essentiel-titre").textContent=e.titre||"Quel document te faut-il ?";
    const grille=document.getElementById("essentiel-cas");
    grille.style.setProperty("--n",Math.min(e.cas.length,3));
    grille.innerHTML=e.cas.map(c=>`<div>
      <div class="cas">${c.titre||""}</div>
      <div style="margin-top:12px">${(c.documents||[]).filter(d=>d.url).map(d=>`<a href="${externe(d.url)}" target="_blank" rel="noopener">↓ ${d.libelle||"Document"}</a>`).join("")}</div>
      ${c.note?`<p class="mono" style="margin-top:14px;font-size:11px;letter-spacing:.08em;color:var(--mention-sombre);text-transform:none">${c.note}</p>`:""}
    </div>`).join("");
    document.getElementById("essentiel").style.display="";
  }
};
</script></body></html>
