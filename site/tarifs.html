<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tarifs &amp; licences — C.A. Brive Corrèze Volley</title>
<meta name="description" content="Le montant de la licence au CAB, catégorie par catégorie, pour la saison en cours.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="C.A. Brive Corrèze Volley">
<meta property="og:title" content="Tarifs &amp; licences — C.A. Brive Corrèze Volley">
<meta property="og:description" content="Le montant de la licence au CAB, catégorie par catégorie, pour la saison en cours.">
<meta property="og:image" content="https://cabc-volley.nkobrs21.workers.dev/assets/partage.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="assets/style.css">
</head><body>
<div id="header"></div>
<main id="main">
<section class="pad section">
  <div class="crumb"><a href="index.html">Accueil</a><span>/</span><span style="color:var(--encre)">Tarifs &amp; licences</span></div>
  <div class="section-head" style="margin-bottom:0"><h1 style="font-size:clamp(38px,9vw,88px)">Tarifs<br>&amp; licences</h1><span class="mono" id="saison" style="align-self:flex-end"></span></div>
</section>
<section class="section pad"><div id="tarifs"></div><div id="nota"></div></section>
<section class="section pad" id="precisions" style="display:none"><div id="precisions-liste"></div></section>
<section class="section pad">
  <div class="row">
    <a class="btn btn-primary" href="adhesion.html">Demander ma licence →</a>
    <a class="btn btn-secondary" href="faq.html">Questions fréquentes →</a>
  </div>
</section>
</main>
<div id="footer"></div><script src="assets/site.js"></script>
<script>
window.__pageInit=async function(){
  const [data,adhesion]=await Promise.all([getJSON("content/tarifs.json"),getJSON("content/adhesion.json")]);

  // La saison n est saisie qu au surtitre du bandeau d Adhesion : c est pour
  // elle, et pour elle seule, que cette page lit encore adhesion.json. Un champ
  // « saison » dans la collection Tarifs serait a corriger deux fois chaque ete.
  const saison=document.getElementById("saison");
  const eyebrow=adhesion?.bandeau?.eyebrow;
  if(eyebrow)saison.textContent=eyebrow; else saison.remove();

  // Une entree a moitie remplie dans Decap ne doit pas produire une carte vide.
  const tarifs=(data?.items||[]).filter(t=>t.montant||t.libelle);
  const zone=document.getElementById("tarifs");
  // Le numero se deduit du rang : le donner a saisir ferait renumeroter toute
  // la grille des qu une ligne s intercale.
  const num=i=>String(i+1).padStart(2,"0");
  // Les annees paraissent deux fois : en colonne, et dans un span sous le
  // libelle que le CSS ne montre que sous 880 px, ou la colonne disparait.
  const ligne=(t,i)=>`
    <tr${t.mise_en_avant?' class="hl"':""}>
      <td class="mono" style="letter-spacing:.16em">${num(i)}</td>
      <td style="font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;font-size:24px;letter-spacing:.03em;line-height:1.15">${echapper(t.libelle)}${t.annees?`<span>${echapper(t.annees)}</span>`:""}</td>
      <td class="muted" style="font-size:14px">${echapper(t.annees||"")}</td>
      <td>${echapper(t.montant)}</td>
    </tr>`;
  // Sans tarif, pas de tableau du tout : un thead seul annoncerait des colonnes
  // vides la ou une phrase dit ce qui se passe.
  zone.innerHTML=tarifs.length?`<table class="ds tarifs"><thead><tr>
      <th>Nº</th><th>Catégorie</th><th>Années de naissance</th><th style="text-align:right">Licence</th>
    </tr></thead><tbody>${tarifs.map(ligne).join("")}</tbody></table>`
    :'<p class="vide muted">Les tarifs de la saison seront publiés prochainement.</p>';

  // La mention vaut pour toute la grille sans etre une ligne. Elle se pose
  // sous le tableau et non dedans, ou elle passait pour une categorie de
  // licence — capitales et prix compris.
  const nota=document.getElementById("nota");
  if(data?.nota&&data.nota.trim())nota.innerHTML=`<div class="nota">${mdToHtml(data.nota)}</div>`;

  // Trois precisions facultatives, vides a la creation de la collection : le
  // club les ecrit depuis Decap. Tant qu elles le sont, la section entiere
  // disparait plutot que de poser trois cartouches vides sous les montants.
  // L intitule vient du code et non de Decap : il nomme le champ, le bureau n a
  // pas a le ressaisir pour chaque saison.
  // Le surtitre court double l intitule : il numerote et resume. Il suit les
  // precisions PRESENTES — seule Pass'Sport remplie, elle porte 01 et non 02.
  const precisions=[
    ["Ce que la licence comprend",data?.comprend,"Compris"],
    ["Pass'Sport",data?.pass_sport,"Aides"],
    ["Paiement en plusieurs fois",data?.paiement,"Paiement"]
  ].filter(p=>p[1]&&p[1].trim());
  if(precisions.length){
    const liste=document.getElementById("precisions-liste");
    // Une precision seule prend la largeur : dans une grille de trois elle
    // serait une carte etroite echouee a gauche.
    liste.className=precisions.length>2?"cols-3":precisions.length>1?"cols-2":"";
    liste.innerHTML=precisions.map(([intitule,texte,court],i)=>`
      <div class="card shadow"><div class="body" style="padding:26px 26px 8px;gap:10px">
        <span class="eyebrow">${num(i)} — ${court}</span>
        <strong class="display-m" style="font-weight:900;text-transform:uppercase;line-height:1.05">${intitule}</strong>
        ${mdToHtml(texte)}
      </div></div>`).join("");
    document.getElementById("precisions").style.display="";
  }
};
</script></body></html>
